name: degent-mint
package: "@bsh/degent-mint"
kind: service
product: degent
owner: team-degent
summary: Automated degent.club mint service - order state machine, art review, policy signer, lane broadcaster; Open Studio artwork orders with the artist royalty verified in the funding tx.
lifecycle: beta
depends_on: ["@bsh/inscription", "@bsh/degent-mint-sdk", "@bsh/events"]
provides: [contracts/openapi/degent-mint.yaml, contracts/asyncapi/degent-mint.yaml]
consumes:
  - "events:block.indexed.{network}"
  - "deps/scribbit/contracts/asyncapi/platform-events.yaml#/channels/degentMintOrderStatus"
  - "deps/scribbit/contracts/asyncapi/platform-events.yaml#/channels/collectionMinted"
  - "contracts/openapi/degent-studio.yaml"
  - "deps/scribbit/contracts/openapi/ledger.yaml"
stores: ["sqlite:degent_mint"]
secrets: ["services/degent-mint/parent-key", "services/degent-mint/art-review-api-key", "services/degent-mint/reveal-encryption-key", "services/degent-mint/libre-rpc-pass", "services/degent-mint/slipstream-api-key", "services/degent-mint/studio-api-key", "services/degent-mint/ledger-api-key"]
env_schema: ./env.schema.json
slo: { availability: "99.9", p95_ms: 300 }
runbook: ./RUNBOOK.md
docs: ./README.md
commands: { dev: dev, test: test, typecheck: typecheck }
