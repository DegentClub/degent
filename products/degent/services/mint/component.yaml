name: degent-mint
package: "@bsh/degent-mint"
kind: service
product: degent
owner: team-degent
summary: Automated degent.club mint service - order state machine, art review, parent co-signing policy signer, lane broadcaster.
lifecycle: beta
depends_on: ["@bsh/inscription", "@bsh/degent-mint-sdk"]
provides: [contracts/openapi/degent-mint.yaml, contracts/asyncapi/degent-mint.yaml]
consumes: ["events:block.indexed.{network}"]
stores: ["sqlite:degent_mint"]
secrets: ["services/degent-mint/parent-key", "services/degent-mint/art-review-api-key"]
env_schema: ./env.schema.json
slo: { availability: "99.9", p95_ms: 300 }
runbook: ./RUNBOOK.md
docs: ./README.md
commands: { dev: dev, test: test, typecheck: typecheck }
