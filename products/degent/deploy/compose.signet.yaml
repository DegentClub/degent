# degent.club signet rehearsal stack: mint-api, mint-worker, web (+ mint-backup). docs/DEPLOY.md, docs/REHEARSAL.md.
#
#   cd products/degent/deploy
#   cp .env.signet.example .env.signet                  # fill in the REQUIRED values
#   mkdir -p secrets && ...                             # one file per secret, see .env.signet.example
#   docker compose -f compose.signet.yaml --env-file .env.signet up -d --build
#   node ../../../scripts/rehearsal/run.mjs --base-url http://127.0.0.1:8080/api --auto
#
# Backends are configurable: ESPLORA_URL / ORD_URL (the fleet's private signet: ord-signet CT 219, an esplora
# for that chain), LIBRE_RPC_URL (btc-signet RPC with acceptnonstdtxn=1 carries the block lane on signet).
# Every variable below is either in products/degent/services/mint/env.schema.json or in compose-vars.json
# (test/deploy.test.ts enforces it). Secrets are files, never environment values.
name: degent-signet

x-mint-env: &mint-env
  NETWORK: signet
  HOST: 0.0.0.0
  PORT: "8787"
  DATABASE_PATH: /var/lib/degent-mint/mint.db
  CONTENT_DIR: /var/lib/degent-mint/content
  ROSTER_FILE: /etc/degent-mint/roster.json
  TRUST_PROXY: "true"
  MINT_MODE: ${MINT_MODE:-}
  # Signet only: the dev in-memory signer with a key file (mainnet refuses both).
  SIGNER: memory
  PARENT_KEY_FILE: /run/secrets/parent-key
  REVEAL_ENCRYPTION_KEY_FILE: /run/secrets/reveal-encryption-key
  SESSION_KEY_FILE: /run/secrets/session-key
  LIBRE_RPC_PASS_FILE: /run/secrets/libre-rpc-pass
  SLIPSTREAM_API_KEY_FILE: /run/secrets/slipstream-api-key
  ART_REVIEW_API_KEY_FILE: /run/secrets/art-review-api-key
  TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram-bot-token
  ESPLORA_URL: ${ESPLORA_URL:?set ESPLORA_URL in .env.signet}
  ORD_URL: ${ORD_URL:?set ORD_URL in .env.signet}
  LIBRE_RPC_URL: ${LIBRE_RPC_URL:-}
  LIBRE_RPC_USER: ${LIBRE_RPC_USER:-}
  SLIPSTREAM_URL: ${SLIPSTREAM_URL:-}
  BLOCK_TIER: ${BLOCK_TIER:-}
  PARENT_INSCRIPTION_ID: ${PARENT_INSCRIPTION_ID:?set PARENT_INSCRIPTION_ID in .env.signet}
  PARENT_OUTPOINT: ${PARENT_OUTPOINT:-}
  COLLECTION_ADDRESS: ${COLLECTION_ADDRESS:?set COLLECTION_ADDRESS in .env.signet}
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS (the web origin) in .env.signet}
  ART_REVIEW_GUIDELINES_FILE: ${ART_REVIEW_GUIDELINES_FILE:-}
  SERVICE_FEE_ADDRESS: ${SERVICE_FEE_ADDRESS:-}
  SERVICE_FEE_SATS_STANDARD: ${SERVICE_FEE_SATS_STANDARD:-}
  SERVICE_FEE_SATS_BLOCK: ${SERVICE_FEE_SATS_BLOCK:-}
  MIN_FEE_RATE: ${MIN_FEE_RATE:-}
  QUOTE_TTL_SECONDS: ${QUOTE_TTL_SECONDS:-}
  RESCUE_AFTER_SECONDS: ${RESCUE_AFTER_SECONDS:-}
  LATE_PAYMENT_WINDOW_SECONDS: ${LATE_PAYMENT_WINDOW_SECONDS:-}
  STANDARD_CONCURRENCY: ${STANDARD_CONCURRENCY:-}
  CONFIRMATIONS: ${CONFIRMATIONS:-}
  WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-}
  APPROVAL_QUORUM: ${APPROVAL_QUORUM:-}
  DECLINE_QUORUM: ${DECLINE_QUORUM:-}
  REVIEW_SLA_SECONDS: ${REVIEW_SLA_SECONDS:-}
  SIWB_DOMAIN: ${SIWB_DOMAIN:?set SIWB_DOMAIN in .env.signet}
  SIWB_URI: ${SIWB_URI:-}
  SIWB_CHALLENGE_TTL_SECONDS: ${SIWB_CHALLENGE_TTL_SECONDS:-}
  SESSION_KID: ${SESSION_KID:-}
  SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-}
  HOLDER_REGISTRY: ${HOLDER_REGISTRY:-}
  ORD_PUBLIC_URL: ${ORD_PUBLIC_URL:-}
  GALLERY_INSCRIPTION_ID: ${GALLERY_INSCRIPTION_ID:-}
  SITE_URL: ${SITE_URL:-}
  NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}

x-mint: &mint
  image: ${DEGENT_IMAGE_PREFIX:-degent}/mint:${DEGENT_IMAGE_TAG:-local}
  build:
    context: ../../..
    dockerfile: products/degent/deploy/mint.Dockerfile
    target: runtime
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  volumes:
    - mint-data:/var/lib/degent-mint
    - ${ROSTER_PATH:-../services/mint/data/roster.json}:/etc/degent-mint/roster.json:ro
  secrets: [parent-key, reveal-encryption-key, session-key, libre-rpc-pass, slipstream-api-key, art-review-api-key, telegram-bot-token]
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "5" }

services:
  mint-api:
    <<: *mint
    command: ["api"]
    environment:
      <<: *mint-env
      MINT_ROLE: api
    expose: ["8787"]

  mint-worker:
    <<: *mint
    # Exactly one worker: the parent UTXO chain is strictly serial.
    command: ["worker"]
    environment:
      <<: *mint-env
      MINT_ROLE: worker
    depends_on:
      mint-api: { condition: service_healthy }

  web:
    image: ${DEGENT_IMAGE_PREFIX:-degent}/web:${DEGENT_IMAGE_TAG:-local}-signet
    build:
      context: ../../..
      dockerfile: products/degent/deploy/web.Dockerfile
      target: runtime
      args:
        VITE_NETWORK: signet
        VITE_MINT_API_URL: /api
        VITE_ESPLORA_URL: ${VITE_ESPLORA_URL:?set VITE_ESPLORA_URL (browser-facing esplora for this chain)}
        VITE_ORD_URL: ${VITE_ORD_URL:-}
        VITE_EXPLORER_URL: ${VITE_EXPLORER_URL:-}
        VITE_SITE_URL: ${VITE_SITE_URL:-}
        VITE_GATE_URL: ${VITE_GATE_URL:-}
        VITE_POLL_MS: ${VITE_POLL_MS:-}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      SITE_ADDRESS: ":8080"
      MINT_API_UPSTREAM: mint-api:8787
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-}
      CSP_IMG_SRC: ${CSP_IMG_SRC:-}
      CSP_HEADER: ${CSP_HEADER:-Content-Security-Policy}
    volumes:
      - web-data:/data
      - web-config:/config
    ports:
      - ${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080
    depends_on:
      mint-api: { condition: service_healthy }

  mint-backup:
    image: ${DEGENT_IMAGE_PREFIX:-degent}/mint-backup:${DEGENT_IMAGE_TAG:-local}
    build:
      context: ../../..
      dockerfile: products/degent/deploy/mint.Dockerfile
      target: backup
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_KEEP: ${BACKUP_KEEP:-48}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      # rw: sqlite needs the -shm file of a WAL database even to read it.
      - mint-data:/var/lib/degent-mint
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      mint-worker: { condition: service_started }

volumes:
  mint-data: {}
  web-data: {}
  web-config: {}

secrets:
  parent-key: { file: "${SECRETS_DIR:-./secrets}/parent-key" }
  reveal-encryption-key: { file: "${SECRETS_DIR:-./secrets}/reveal-encryption-key" }
  session-key: { file: "${SECRETS_DIR:-./secrets}/session-key" }
  libre-rpc-pass: { file: "${SECRETS_DIR:-./secrets}/libre-rpc-pass" }
  slipstream-api-key: { file: "${SECRETS_DIR:-./secrets}/slipstream-api-key" }
  art-review-api-key: { file: "${SECRETS_DIR:-./secrets}/art-review-api-key" }
  telegram-bot-token: { file: "${SECRETS_DIR:-./secrets}/telegram-bot-token" }
