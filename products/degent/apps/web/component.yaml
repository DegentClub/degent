name: degent-web
package: "@bsh/degent-web"
kind: app
product: degent
owner: team-degent
summary: degent.club website - home, certified collection gallery with on-chain lightbox, the Atelier (AI or your own art to exact mint bytes), comic, blog, club sign-in, and the non-custodial mint at /mint.
lifecycle: beta
depends_on: ["@bsh/inscription", "@bsh/wallet-kit", "@bsh/degent-mint-sdk"]
consumes: [contracts/openapi/degent-mint.yaml, contracts/openapi/degent-atelier.yaml]
docs: ./README.md
commands: { dev: dev, test: test, typecheck: typecheck, build: build }
