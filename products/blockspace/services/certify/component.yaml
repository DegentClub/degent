name: blockspace-certify
package: "@bsh/blockspace-certify"
kind: service
product: blockspace
owner: team-blockspace
summary: '"Verified by block.space" collection certification - parent/child + inscribed-manifest membership, reproducible stats, BIP340-signed attestations.'
lifecycle: experimental
depends_on: []
provides: [contracts/openapi/blockspace-collections.yaml]
stores: ["memory:blockspace_certify_snapshots"]
secrets: ["services/blockspace-certify/attestation-key", "services/blockspace-certify/admin-token"]
env_schema: ./env.schema.json
slo: { availability: "99.9", p95_ms: 200 }
runbook: ./RUNBOOK.md
docs: ./README.md
commands: { dev: dev, test: test, typecheck: typecheck }
