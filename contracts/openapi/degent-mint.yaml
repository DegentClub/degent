openapi: 3.1.0
info:
  title: degent.club mint API
  version: 0.1.0
  summary: Non-custodial, parent-linked inscription minting for the Decentralized Gentlemen Club.
  description: |
    Implemented by `@bsh/degent-mint` (products/degent/services/mint); typed client and domain types in
    `@bsh/degent-mint-sdk`. Design: docs/adr/0002-degent-mint-architecture.md, amended by
    docs/adr/0005-strict-reveal-and-tiers.md (SIGHASH_ALL|ANYONECANPAY reveals, re-signed rescue, three tiers by
    content bytes, block-lane weight budget).

    Flow: `POST /v1/orders` (indicative quote + one-time `orderToken`) -> `PUT /v1/orders/{id}/content`
    (raw bytes; review; binding quote + commit address) -> `POST /v1/orders/{id}/reveal` (half-signed reveal
    `[commit] -> [parent return, child]` signed 0x81, verified and stored encrypted) -> user funds the commit ->
    the service inserts the parent input, co-signs it and reveals -> `GET /v1/orders/{id}` to track. If the
    service cannot reveal within `rescueAfterSeconds`, `GET /v1/orders/{id}/rescue` returns the INPUTS for a
    parent-less rescue that the browser re-signs with the ephemeral key kept in the user's recovery bundle.

    Open Studio artwork orders (ADR-0007, docs/open-studio-plan.md §3): `POST /v1/orders` with `artworkId`
    takes the content facts and the bytes from the Artist Studio (`contracts/openapi/degent-studio.yaml`),
    skips the upload step (the artwork was reviewed at submission) and returns the order already `approved`
    with a binding quote whose `totalSats = commitValueSats + clubFeeSats + artistRoyaltySats`. The minter's
    funding transaction then carries `[commit, artist royalty, club fee, change]` (§3.2); the worker verifies
    the artist and club outputs by script before the parent is ever co-signed (§3.3). The reveal envelope
    carries attribution metadata `{ artist, artwork, edition, studio: "degent.club" }` (ord tag 5, canonical
    CBOR, `@bsh/inscription.encodeAttribution`), so the browser must build it with the quote's
    `artistAddress`, `artworkId` and `edition` (§3.4). Every field added for artwork orders is optional and
    absent on plain orders.

    Tiers (`Tier`) are decided by CONTENT BYTES: `standard` (Standard Degent, 200,000-400,000 B), `large`
    (Large Degent, 400,001-3,499,999 B), `fullblock` (Full Block Degent, 3,500,000-3,900,000 B). Lanes
    (`Lane`) are transport, decided by the reveal WEIGHT: <= 400,000 WU is `standard`, else `block`. The
    block lane packs reveals into a 3,990,000 WU per-block budget; a Full Block Degent never shares.

    Conventions: amounts are integer sats as JSON numbers; timestamps are ISO 8601 UTC; hashes/keys are
    lowercase hex. Every error is `{ "error": { "code", "message", "details"? } }`. Browser calls are
    subject to a CORS allowlist (default deny). POST/PUT are rate limited per client IP. Responses carry
    `cache-control: no-store`.
  license: { name: Proprietary, identifier: LicenseRef-Proprietary }
servers:
  - url: https://mint.degent.club
    description: production (mainnet)
  - url: http://127.0.0.1:8787
    description: local dev (regtest)
tags:
  - name: service
  - name: orders
  - name: admin
    description: Operator endpoints (API key with scope `mint:admin`; never called by browsers).
security: []
paths:
  /v1/health:
    get:
      tags: [service]
      operationId: getHealth
      summary: Liveness plus dependency checks (always 200; see `status`).
      description: |
        `checks` always has `store`, and `chain` / `parent` when wired. Production adds `bus` (RabbitMQ bridge:
        connected, pending backlog; `in-process only` when AMQP_URL is unset), `signer` (SIGNER=remote: the
        platform signer answers on this network) and, only while the parent value circuit breaker is open,
        `parentValue` (`ok: false`; co-signing is paused until `POST /v1/admin/parent/ack`).
      responses:
        '200':
          description: Health report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /v1/config:
    get:
      tags: [service]
      operationId: getConfig
      summary: Collection rules, tiers and addresses the front end must show and enforce.
      responses:
        '200':
          description: Service configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceConfig' }
  /v1/fees:
    get:
      tags: [service]
      operationId: getFees
      summary: Current fee rates per lane (sat/vB), clamped to the minimum.
      responses:
        '200':
          description: Fee rates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeesResponse' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/queue:
    get:
      tags: [service]
      operationId: getQueue
      summary: Lane occupancy. The block lane is a per-block weight budget; ETA is block slot x ~10 min, not a promise.
      responses:
        '200':
          description: Queue snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueResponse' }
  /v1/orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: Create an order (status `awaiting_content`) with an indicative quote.
      description: |
        Validates the declared metadata against the collection rules (type, tier size bounds), the
        recipient address (taproot, on the service network), the ephemeral reveal public key (valid x-only
        point) and the fee rate (>= minFeeRate, <= the lane's policy maximum). The quote's `lane` is decided
        by the exact reveal weight, so a `standard`-tier order near 400,000 bytes can come back with
        `lane: block`. Returns a random 256-bit `orderToken` exactly once; the service stores only its SHA-256.
        Block-lane orders are refused with 503 `queue_full` when the block slot they would get lies beyond
        the rescue timeout.

        With `artworkId` (Open Studio): the artwork must exist in the studio (404 `artwork_not_found`), be
        `approved` (409 `artwork_not_mintable` for any other status, e.g. delisted), not sold out (409
        `artwork_not_mintable` with `details.soldOut: true` once the studio's `maxEditions` is reached by minted
        editions plus live quotes, ADR-0012; checked inside the edition reservation, so two concurrent orders for
        the last edition cannot both be quoted) and its artist must have a
        proven P2WPKH / P2TR payout address (409 `artist_payout_missing`); the declared content facts must
        equal the artwork record's (422 `content_mismatch`). The order is created, walked through
        `awaiting_content -> reviewing -> approved` (timeline detail `artwork <id> reviewed at submission`)
        and returned `approved` with a binding quote carrying `clubFeeSats`, `artistRoyaltySats`,
        `artistAddress`, `artworkId`, `mintPriceSats` and the reserved `edition` (held until `expiresAt`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateOrderResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404':
          description: Open Studio - the artwork does not exist in the studio (code `artwork_not_found`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Open Studio - the artwork is not `approved` or is sold out (code `artwork_not_mintable`, `details.soldOut`) or its artist has no proven payout address (code `artist_payout_missing`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [orders]
      operationId: getOrder
      summary: Public order view (never includes the half-signed reveal or the token).
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/orders/{id}/content:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    put:
      tags: [orders]
      operationId: uploadContent
      summary: Upload the exact bytes to inscribe; runs automated review; returns the binding quote.
      description: |
        Requires status `awaiting_content`. Rejected with 422 `content_mismatch` when the length or SHA-256
        differs from the declaration. Review re-checks the real bytes (magic-byte type, header dimensions,
        size) and optionally a vision model. On approval the order becomes `approved` with a binding quote
        (`binding: true`, `commitAddress` set, new `expiresAt`); on rejection it becomes `rejected` (still
        200, see `review.reasons`). If the reviewer is unavailable: 503 `review_unavailable` and the order
        stays `awaiting_content`.
      security:
        - orderToken: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
              maxLength: 4194304
      responses:
        '200':
          description: Order after review (`approved` or `rejected`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/orders/{id}/reveal:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [orders]
      operationId: submitReveal
      summary: Submit the half-signed reveal (SIGHASH_ALL|ANYONECANPAY, 0x81) before funding the commit.
      description: |
        Requires status `approved` and an unexpired quote. The PSBT is `[commit] -> [parent return, child]`
        with output 0 = (`collectionAddress`, `parentValueSats`) from `GET /v1/config` and output 1 = the
        order's recipient with `postageSats`. Verified with `@bsh/inscription.verifyHalfSignedReveal` against
        the stored content, recipient, postage, commit outpoint, commit value, parent return address and
        value, and hash type 0x81 (0x83 is refused). Stored encrypted (AES-256-GCM) outside the order row;
        never returned or emitted. Order becomes `awaiting_payment`.
      security:
        - orderToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitRevealRequest' }
      responses:
        '200':
          description: Order in `awaiting_payment`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/orders/{id}/rescue:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [orders]
      operationId: getRescue
      summary: Inputs for the parent-less self-rescue ([commit] -> [child]) once the order is `rescue_available`.
      description: |
        ADR-0005 §2. The service holds nothing broadcastable without the parent (0x81 signs the parent
        return output), so it returns the order facts the browser needs to re-sign `[commit] -> [child]`
        itself with `@bsh/inscription.buildResignedRescue` and the ephemeral key K_e from the user's
        recovery bundle. Never contains a transaction, a PSBT or a key.
      security:
        - orderToken: []
      responses:
        '200':
          description: Rescue inputs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RescueInputs' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: Not `rescue_available` (code `rescue_unavailable`, `details.status` = current status)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/admin/parent/ack:
    post:
      tags: [admin]
      operationId: acknowledgeParentValueChange
      summary: Acknowledge a parent value change and resume co-signing (closes the circuit breaker).
      description: |
        When the stored parent UTXO's VALUE changes (a re-initialisation with another value), every stored 0x81
        reveal is signed for a parent return that can no longer be built, and the worker stops co-signing
        (log `parent.value.changed`, health check `parentValue`). An operator follows the RUNBOOK ("Re-leasing or
        re-initialising the parent"), then acknowledges here naming the parent they checked. A mismatch with the
        current parent is 409 `conflict` (`details.current` is what is there now). With no open alert the call
        succeeds with `acknowledged: null` (idempotent). Acknowledging does not relax the value check itself:
        the worker still refuses a parent whose value differs from `PARENT_VALUE_SATS`.
      security:
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParentAckRequest' }
      responses:
        '200':
          description: Breaker closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParentAckResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

components:
  securitySchemes:
    orderToken:
      type: http
      scheme: bearer
      description: |
        The `orderToken` returned once by `POST /v1/orders`. Missing or malformed -> 401 `unauthorized`;
        wrong token for the order -> 403 `forbidden`. Compared in constant time against a stored SHA-256.
    adminApiKey:
      type: http
      scheme: bearer
      description: |
        An `@bsh/edge` API key (`bsh_live_…` on mainnet) with scope `mint:admin`, as `Authorization: Bearer` or
        `X-API-Key`. The service stores only its SHA-256 (MINT_ADMIN_API_KEYS_JSON). Missing/invalid -> 401
        `unauthorized`; missing scope -> 403 `forbidden`.
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$', examples: [dgt_4f1c2a9b0e6d7c8a1b2c3d4e] }
  headers:
    RetryAfter:
      description: Seconds until the rate-limit window resets.
      schema: { type: integer }
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many POST/PUT requests from this client IP (code `rate_limited`)
      headers:
        retry-after: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Network: { type: string, enum: [mainnet, testnet, signet, regtest] }
    Tier:
      type: string
      enum: [standard, large, fullblock]
      description: Product tier by CONTENT BYTES (ADR-0005 §3). Not the transport lane.
    Lane:
      type: string
      enum: [standard, block]
      description: Transport lane by reveal WEIGHT (<= 400,000 WU standard, else block).
    Sats: { type: integer, minimum: 0, description: Integer satoshis }
    Timestamp: { type: string, format: date-time }
    Hex32: { type: string, pattern: '^[0-9a-f]{64}$' }
    Txid: { type: string, pattern: '^[0-9a-f]{64}$' }
    OrderStatus:
      type: string
      enum:
        [awaiting_content, reviewing, approved, rejected, awaiting_payment, paid, queued, revealing, revealed,
         confirmed, verified, delivered, expired, rescue_available, failed]
      description: |
        ADR-0002 §6 state machine. Terminal: rejected, delivered, failed. `expired` can still become `paid`
        if the commit is funded late; `rescue_available` becomes `revealed` when the commit is spent.
    TierRule:
      type: object
      additionalProperties: false
      required: [tier, minBytes, maxBytes, lane, sharesBlock, label, description]
      properties:
        tier: { $ref: '#/components/schemas/Tier' }
        minBytes: { type: integer }
        maxBytes: { type: integer }
        lane: { allOf: [{ $ref: '#/components/schemas/Lane' }], description: The lane this tier USUALLY travels; the quote's lane is binding. }
        sharesBlock: { type: boolean, description: False for the Full Block Degent, which always takes a block alone. }
        label: { type: string, examples: [Standard Degent, Large Degent, Full Block Degent] }
        description: { type: string }
    CollectionConfig:
      type: object
      required: [network, collectionName, parentInscriptionId, allowedContentTypes, tiers, maxDimensionPx, minDimensionPx,
                 postageSats, serviceFeeSats, minFeeRate, quoteTtlSeconds, rescueAfterSeconds]
      properties:
        network: { $ref: '#/components/schemas/Network' }
        collectionName: { type: string }
        parentInscriptionId: { type: [string, 'null'], pattern: '^[0-9a-f]{64}i[0-9]+$' }
        allowedContentTypes:
          type: array
          items: { type: string }
          examples: [[image/png, image/jpeg, image/webp, image/avif, image/gif]]
        tiers: { type: array, items: { $ref: '#/components/schemas/TierRule' } }
        maxDimensionPx: { type: integer, examples: [4096] }
        minDimensionPx: { type: integer, examples: [256] }
        postageSats: { $ref: '#/components/schemas/Sats' }
        serviceFeeSats:
          type: object
          additionalProperties: false
          required: [standard, large, fullblock]
          properties:
            standard: { $ref: '#/components/schemas/Sats' }
            large: { $ref: '#/components/schemas/Sats' }
            fullblock: { $ref: '#/components/schemas/Sats' }
        minFeeRate: { type: number, description: sat/vB }
        quoteTtlSeconds: { type: integer }
        rescueAfterSeconds: { type: integer }
    ServiceConfig:
      allOf:
        - $ref: '#/components/schemas/CollectionConfig'
        - type: object
          required: [collectionAddress, parentValueSats, serviceFeeAddress, maxUploadBytes]
          properties:
            collectionAddress: { type: string, description: Taproot address holding the parent (parent return output). }
            parentValueSats: { allOf: [{ $ref: '#/components/schemas/Sats' }], description: Constant value of the parent UTXO; the browser signs output 0 = (collectionAddress, parentValueSats). }
            serviceFeeAddress: { type: [string, 'null'] }
            maxUploadBytes: { type: integer, examples: [4194304] }
            royaltyBps:
              type: integer
              minimum: 0
              maximum: 10000
              description: Open Studio - artist royalty in basis points of the mint price (commitValueSats + clubFeeSats). Default 1000.
            clubFeeBps:
              type: object
              additionalProperties: false
              required: [standard, large, fullblock]
              description: Open Studio - club fee per tier in basis points of commitValueSats, paid to serviceFeeAddress. Default 1000 each.
              properties:
                standard: { type: integer, minimum: 0, maximum: 10000 }
                large: { type: integer, minimum: 0, maximum: 10000 }
                fullblock: { type: integer, minimum: 0, maximum: 10000 }
            studioUrl: { type: [string, 'null'], description: Open Studio - base URL of the Artist Studio artworks are taken from; null when artwork orders are disabled. }
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [tier, contentType, contentLength, contentSha256, recipientAddress, revealPubkey, feeRate]
      properties:
        tier: { $ref: '#/components/schemas/Tier' }
        contentType: { type: string, maxLength: 100 }
        contentLength: { type: integer, minimum: 1 }
        contentSha256: { $ref: '#/components/schemas/Hex32' }
        recipientAddress: { type: string, description: Taproot ordinals address on the service network. }
        revealPubkey: { allOf: [{ $ref: '#/components/schemas/Hex32' }], description: Ephemeral x-only key K_e generated in the browser. }
        feeRate: { type: number, exclusiveMinimum: 0, description: 'sat/vB, at most 3 decimals' }
        artworkId:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
          description: Open Studio - mint this approved studio artwork. contentType / contentLength / contentSha256 must equal the artwork record's; the bytes come from the studio and the upload step is skipped.
    CreateOrderResponse:
      type: object
      additionalProperties: false
      required: [order, orderToken]
      properties:
        order: { $ref: '#/components/schemas/Order' }
        orderToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: 256-bit base64url bearer secret, returned once. Store it with the local recovery bundle.
    Quote:
      type: object
      additionalProperties: false
      required: [tier, lane, feeRate, revealWeight, revealVsize, revealFeeSats, postageSats, serviceFeeSats,
                 commitValueSats, totalSats, commitAddress, binding, expiresAt, queuePosition, etaMinutes]
      properties:
        tier: { $ref: '#/components/schemas/Tier' }
        lane: { allOf: [{ $ref: '#/components/schemas/Lane' }], description: Decided by revealWeight, not by tier. }
        feeRate: { type: number }
        revealWeight: { type: integer, description: Exact weight (WU) of the final parent-linked reveal. }
        revealVsize: { type: integer }
        revealFeeSats: { $ref: '#/components/schemas/Sats' }
        postageSats: { $ref: '#/components/schemas/Sats' }
        serviceFeeSats: { $ref: '#/components/schemas/Sats' }
        commitValueSats: { allOf: [{ $ref: '#/components/schemas/Sats' }], description: revealFee + postage; exact amount for the commit output. }
        totalSats: { allOf: [{ $ref: '#/components/schemas/Sats' }], description: 'Plain orders: commitValue + serviceFee. Artwork orders: commitValue + clubFee + artistRoyalty (serviceFeeSats is 0). Funding tx fee excluded.' }
        commitAddress: { type: [string, 'null'], description: Null on the indicative quote. }
        binding: { type: boolean }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        queuePosition: { type: [integer, 'null'], description: Block lane only - the 1-based block slot (several Large Degents can share a slot). }
        etaMinutes: { type: [integer, 'null'] }
        clubFeeSats: { allOf: [{ $ref: '#/components/schemas/Sats' }], description: 'Open Studio - floor(commitValueSats x clubFeeBps / 10000) for the tier; output [2] of the funding tx to serviceFeeAddress. Present on artwork orders only.' }
        artistRoyaltySats: { allOf: [{ $ref: '#/components/schemas/Sats' }], description: 'Open Studio - floor(mintPriceSats x royaltyBps / 10000), raised to the dust limit of the payout script type (P2TR 330, P2WPKH 294); output [1] of the funding tx to artistAddress. Present on artwork orders only.' }
        artistAddress: { type: string, description: Open Studio - the artist's proven payout address (destination of the royalty output). }
        artworkId: { type: string }
        mintPriceSats: { allOf: [{ $ref: '#/components/schemas/Sats' }], description: Open Studio - commitValueSats + clubFeeSats, the royalty base. }
        edition: { type: integer, minimum: 1, description: Open Studio - the edition reserved for this order until expiresAt; the browser signs the attribution metadata with it. }
        royaltyRaisedToDust: { type: boolean, description: Open Studio - true when the royalty was below the payout script's dust limit and was raised to it. }
    ReviewCheck:
      type: object
      additionalProperties: false
      required: [id, passed, detail]
      properties:
        id: { type: string }
        passed: { type: boolean }
        detail: { type: string }
    ReviewResult:
      type: object
      additionalProperties: false
      required: [approved, reasons, checks]
      properties:
        approved: { type: boolean }
        reasons: { type: array, items: { type: string } }
        checks: { type: array, items: { $ref: '#/components/schemas/ReviewCheck' } }
    OrderEvent:
      type: object
      additionalProperties: false
      required: [status, at]
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        at: { $ref: '#/components/schemas/Timestamp' }
        detail: { type: string }
        txid: { $ref: '#/components/schemas/Txid' }
    QueueInfo:
      type: object
      additionalProperties: false
      required: [lane, position, etaMinutes]
      properties:
        lane: { $ref: '#/components/schemas/Lane' }
        position: { type: [integer, 'null'] }
        etaMinutes: { type: [integer, 'null'] }
    Outpoint:
      type: object
      additionalProperties: false
      required: [txid, vout]
      properties:
        txid: { $ref: '#/components/schemas/Txid' }
        vout: { type: integer, minimum: 0 }
    Order:
      type: object
      additionalProperties: false
      required: [id, network, status, tier, contentType, contentLength, contentSha256, recipientAddress, revealPubkey,
                 quote, review, commitOutpoint, revealTxid, inscriptionId, rescued, serviceFeeAddress, queue, timeline,
                 createdAt, updatedAt]
      properties:
        id: { type: string }
        network: { $ref: '#/components/schemas/Network' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        tier: { $ref: '#/components/schemas/Tier' }
        contentType: { type: string }
        contentLength: { type: integer }
        contentSha256: { $ref: '#/components/schemas/Hex32' }
        recipientAddress: { type: string }
        revealPubkey: { $ref: '#/components/schemas/Hex32' }
        quote: { oneOf: [{ $ref: '#/components/schemas/Quote' }, { type: 'null' }] }
        review: { oneOf: [{ $ref: '#/components/schemas/ReviewResult' }, { type: 'null' }] }
        commitOutpoint: { oneOf: [{ $ref: '#/components/schemas/Outpoint' }, { type: 'null' }] }
        revealTxid: { type: [string, 'null'] }
        inscriptionId: { type: [string, 'null'], description: '"<revealTxid>i0"' }
        rescued: { type: boolean, description: True when the child landed via self-rescue (no parent link). }
        serviceFeeAddress: { type: [string, 'null'] }
        queue: { oneOf: [{ $ref: '#/components/schemas/QueueInfo' }, { type: 'null' }], description: Set while paid/queued. }
        timeline: { type: array, items: { $ref: '#/components/schemas/OrderEvent' } }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        artworkId: { type: string, description: Open Studio - present on artwork orders only (all fields below likewise). }
        artistAddress: { type: string }
        artistRoyaltySats: { $ref: '#/components/schemas/Sats' }
        clubFeeSats: { $ref: '#/components/schemas/Sats' }
        edition: { type: integer, minimum: 1, description: Open Studio - assigned when the order reaches paid (the quote-time reservation becomes the edition). }
        royaltyPaid: { oneOf: [{ $ref: '#/components/schemas/RoyaltyPaid' }, { type: 'null' }], description: Open Studio - the verified artist royalty output of the funding tx; null until paid. }
    RoyaltyPaid:
      type: object
      additionalProperties: false
      required: [txid, vout, sats]
      description: Open Studio - the artist royalty output as found in the minter's funding transaction (plan §3.3).
      properties:
        txid: { $ref: '#/components/schemas/Txid' }
        vout: { type: integer, minimum: 0 }
        sats: { $ref: '#/components/schemas/Sats' }
    SubmitRevealRequest:
      type: object
      additionalProperties: false
      required: [commitTxid, commitVout, halfSignedRevealPsbt]
      properties:
        commitTxid: { type: string, pattern: '^[0-9a-fA-F]{64}$', description: Txid of the (unsigned) funding tx. }
        commitVout: { type: integer, minimum: 0, maximum: 4294967295 }
        halfSignedRevealPsbt: { type: string, contentEncoding: base64, description: '[commit] -> [parent return, child] PSBT, commit input signed with SIGHASH_ALL|ANYONECANPAY (0x81). Max request body 8 MiB.' }
        commitAddress: { type: string, description: Optional browser-computed commit address; must equal the quote's. }
    RescueInputs:
      type: object
      additionalProperties: false
      required: [orderId, network, commitTxid, commitVout, commitValueSats, contentType, contentLength, contentSha256,
                 parentInscriptionId, recipientAddress, revealPubkey, postageSats, rescueWeight, rescueFeeSats,
                 rescueFeeRate, suggestedFeeRate]
      properties:
        orderId: { type: string }
        network: { $ref: '#/components/schemas/Network' }
        commitTxid: { $ref: '#/components/schemas/Txid' }
        commitVout: { type: integer, minimum: 0 }
        commitValueSats: { $ref: '#/components/schemas/Sats' }
        contentType: { type: string }
        contentLength: { type: integer }
        contentSha256: { allOf: [{ $ref: '#/components/schemas/Hex32' }], description: The browser checks the bytes it holds against this before signing. }
        parentInscriptionId: { type: [string, 'null'], pattern: '^[0-9a-f]{64}i[0-9]+$', description: Envelope parent tag the commit was built with. }
        recipientAddress: { type: string }
        revealPubkey: { allOf: [{ $ref: '#/components/schemas/Hex32' }], description: x-only key of K_e; the bundle must hold the matching private key. }
        postageSats: { $ref: '#/components/schemas/Sats' }
        rescueWeight: { type: integer, description: Exact weight (WU) of the re-signed rescue tx. }
        rescueFeeSats: { allOf: [{ $ref: '#/components/schemas/Sats' }], description: commitValueSats - postageSats; the whole remainder is fee. }
        rescueFeeRate: { type: number, description: rescueFeeSats / vsize, sat/vB. }
        suggestedFeeRate: { type: number, description: Current standard-lane estimate, so the UI can say whether the rescue is competitive. }
        artworkId: { type: string, description: Open Studio - the attribution the envelope was built with; the rescue must reproduce it (plan §3.4, §3.6). }
        artistAddress: { type: string }
        edition: { type: integer, minimum: 1 }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, network, version, time, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        network: { $ref: '#/components/schemas/Network' }
        version: { type: string }
        time: { $ref: '#/components/schemas/Timestamp' }
        checks:
          type: object
          additionalProperties:
            type: object
            required: [ok]
            properties:
              ok: { type: boolean }
              detail: { type: string }
    FeesResponse:
      type: object
      additionalProperties: false
      required: [network, minFeeRate, standard, block, fetchedAt]
      properties:
        network: { $ref: '#/components/schemas/Network' }
        minFeeRate: { type: number }
        standard:
          type: object
          required: [slow, normal, fast]
          properties:
            slow: { type: number }
            normal: { type: number }
            fast: { type: number }
        block:
          type: object
          required: [min, recommended]
          properties:
            min: { type: number }
            recommended: { type: number }
        fetchedAt: { $ref: '#/components/schemas/Timestamp' }
    LaneQueue:
      type: object
      additionalProperties: false
      required: [lane, waiting, inFlight, capacity, etaMinutesForNext]
      properties:
        lane: { $ref: '#/components/schemas/Lane' }
        waiting: { type: integer }
        inFlight: { type: integer }
        capacity: { type: integer, description: 'standard: reveals in flight allowed; block: blocks in flight (1).' }
        weightBudget: { type: [integer, 'null'], description: Block lane - per-block weight budget (3990000 WU); null for standard. }
        inFlightWeight: { type: integer, description: Block lane - weight (WU) of reveals currently in flight; 0 for standard. }
        etaMinutesForNext: { type: [integer, 'null'] }
    QueueResponse:
      type: object
      additionalProperties: false
      required: [standard, block, tipHeight]
      properties:
        standard: { $ref: '#/components/schemas/LaneQueue' }
        block: { $ref: '#/components/schemas/LaneQueue' }
        tipHeight: { type: [integer, 'null'] }
    ErrorCode:
      type: string
      description: |
        Open set (`x-extensible-enum`, the platform ledger convention): clients must tolerate codes they do not
        know. Open Studio (plan §3.1) added `artwork_not_found`, `artwork_not_mintable` (not approved,
        delisted, or sold out per ADR-0012) and `artist_payout_missing`.
      x-extensible-enum:
        [bad_request, unauthorized, forbidden, validation_failed, not_found, conflict, quote_expired, payload_too_large,
         unsupported_media_type, rate_limited, forbidden_origin, content_mismatch, reveal_invalid,
         rescue_unavailable, review_unavailable, queue_full, upstream_unavailable, internal,
         artwork_not_found, artwork_not_mintable, artist_payout_missing]
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            details: {}
    ParentLocation:
      type: object
      additionalProperties: false
      required: [outpoint, valueSats]
      properties:
        outpoint: { type: string, pattern: '^[0-9a-f]{64}:[0-9]+$' }
        valueSats: { $ref: '#/components/schemas/Sats' }
    ParentAckRequest:
      type: object
      additionalProperties: false
      required: [outpoint, valueSats]
      properties:
        outpoint: { type: string, pattern: '^[0-9a-f]{64}:[0-9]+$', description: The current parent outpoint the operator verified on chain. }
        valueSats: { allOf: [{ $ref: '#/components/schemas/Sats' }], description: The value the operator verified (sats). }
        note: { type: string, maxLength: 500, description: Free text for the audit trail (e.g. the change ticket). }
    ParentValueAlert:
      type: object
      additionalProperties: false
      required: [at, reason, previous, current]
      properties:
        at: { $ref: '#/components/schemas/Timestamp' }
        reason: { type: string, enum: [initialise, advance] }
        previous: { $ref: '#/components/schemas/ParentLocation' }
        current: { $ref: '#/components/schemas/ParentLocation' }
    ParentAckResponse:
      type: object
      additionalProperties: false
      required: [circuit, parent, acknowledged]
      properties:
        circuit: { type: string, const: closed }
        parent: { $ref: '#/components/schemas/ParentLocation' }
        acknowledged:
          description: The alert that was closed, or null when none was open.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [alert, acknowledgedAt, acknowledgedBy]
              properties:
                alert: { $ref: '#/components/schemas/ParentValueAlert' }
                acknowledgedAt: { $ref: '#/components/schemas/Timestamp' }
                acknowledgedBy: { type: string, description: Admin API key id. }
                note: { type: string }
