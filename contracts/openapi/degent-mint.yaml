openapi: 3.1.0
info:
  title: degent.club mint API
  version: 0.5.0
  summary: Non-custodial, parent-linked inscription minting for the Decentralized Gentlemen Club.
  description: |
    Implemented by `@bsh/degent-mint` (products/degent/services/mint); typed client and domain types in
    `@bsh/degent-mint-sdk`. Design: docs/adr/0002-degent-mint-architecture.md.

    Flow (Design -> Mint -> Confirm -> Approve, ADR-0007): `POST /v1/orders` (indicative quote + one-time
    `orderToken`) -> `PUT /v1/orders/{id}/content` (raw bytes; automated review; binding quote + commit address)
    -> `POST /v1/orders/{id}/reveal` (half-signed reveal, SIGHASH_ALL|ANYONECANPAY over [parent return, child],
    ADR-0005; verified and stored encrypted) -> user funds the
    commit (`paid` -> `confirming`) -> commit confirmed (`member_review`) -> existing members vote
    (`POST /v1/orders/{id}/votes`, holder session from `/v1/auth/*`) -> approval quorum assigns the Degent
    number and queues the parent-linked reveal -> `GET /v1/orders/{id}` to track. A decline quorum
    (`declined`) or a lapsed review SLA (`rescue_available`) offers `GET /v1/orders/{id}/rescue`: the parameters
    (incl. the content bytes) from which the browser re-signs a parent-less `[commit] -> [child]` reveal with its
    ephemeral key K_e (the inscription lands, it is just not a Degent). K_e never reaches the service.

    The Register (`/v1/register*`, `/v1/explorer`, `/v1/stats`) is the public, read-only membership roster:
    the 4,112 Gallery members plus every approved, delivered child of the parent.

    Modes: `GET /v1/config` and `GET /v1/health` report `mode`. `full`: the mint takes orders. `readonly`
    (`MINT_MODE=readonly`, e.g. mainnet before minting opens): health, config, fees, queue (empty), the Register,
    explorer and stats are served; every order, vote, subscription and sign-in write, and the members' review
    queue, answer 503 with code `mint_not_open` (response `MintNotOpen`, `retry-after` in seconds). No worker
    runs and no policy signer or parent is used in read-only mode.

    Conventions: amounts are integer sats as JSON numbers; timestamps are ISO 8601 UTC; hashes/keys are
    lowercase hex. Every error is `{ "error": { "code", "message", "details"? } }`. Browser calls are
    subject to a CORS allowlist (default deny). POST/PUT are rate limited per client IP. Responses carry
    `cache-control: no-store`.
  license: { name: Proprietary, identifier: LicenseRef-Proprietary }
servers:
  - url: https://mint.degent.club
    description: production (mainnet)
  - url: http://127.0.0.1:8787
    description: local dev (regtest)
tags:
  - name: service
  - name: orders
  - name: auth
  - name: review
  - name: register
security: []
paths:
  /v1/health:
    get:
      tags: [service]
      operationId: getHealth
      summary: Liveness plus dependency checks (always 200; see `status`).
      responses:
        '200':
          description: Health report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /v1/config:
    get:
      tags: [service]
      operationId: getConfig
      summary: Collection rules, tiers and addresses the front end must show and enforce.
      responses:
        '200':
          description: Service configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceConfig' }
  /v1/fees:
    get:
      tags: [service]
      operationId: getFees
      summary: Current fee rates per lane (sat/vB), clamped to the minimum.
      responses:
        '200':
          description: Fee rates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeesResponse' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/queue:
    get:
      tags: [service]
      operationId: getQueue
      summary: Lane occupancy. Block Degents are one per block; ETA is position x ~10 min, not a promise.
      responses:
        '200':
          description: Queue snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueResponse' }
  /v1/orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: Create an order (status `awaiting_content`) with an indicative quote.
      description: |
        Validates the declared metadata against the collection rules (type, tier size bounds), the
        recipient address (taproot, on the service network), the ephemeral reveal public key (valid x-only
        point) and the fee rate (>= minFeeRate, <= the lane's policy maximum). Returns a random 256-bit
        `orderToken` exactly once; the service stores only its SHA-256. Block-tier orders are refused with
        503 `queue_full` when the block queue would outlast the rescue timeout.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateOrderResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/MintNotOpen' }
  /v1/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [orders]
      operationId: getOrder
      summary: Public order view (never includes the half-signed reveal or the token).
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/orders/{id}/content:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    put:
      tags: [orders]
      operationId: uploadContent
      summary: Upload the exact bytes to inscribe; runs automated review; returns the binding quote.
      description: |
        Requires status `awaiting_content`. The binding quote carries `parentReturnAddress` and `parentValueSats`,
        which the browser signs as output 0 of the reveal (ADR-0005); when the service does not know its parent UTXO
        yet the upload is refused with 503 `upstream_unavailable` before review. Rejected with 422 `content_mismatch` when the length or SHA-256
        differs from the declaration. Review re-checks the real bytes (magic-byte type, header dimensions,
        size) and optionally a vision model. On approval the order becomes `approved` with a binding quote
        (`binding: true`, `commitAddress` set, new `expiresAt`); on rejection it becomes `rejected` (still
        200, see `review.reasons`). If the reviewer is unavailable: 503 `review_unavailable` and the order
        stays `awaiting_content`.
      security:
        - orderToken: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
              maxLength: 4194304
      responses:
        '200':
          description: Order after review (`approved` or `rejected`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/MintNotOpen' }
  /v1/orders/{id}/reveal:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [orders]
      operationId: submitReveal
      summary: Submit the half-signed reveal (SIGHASH_ALL|ANYONECANPAY, 0x81) before funding the commit.
      description: |
        Requires status `approved` and an unexpired quote. `[commit] -> [parent return, child]`, the commit input
        signed with 0x81 (ADR-0005). Verified with `@bsh/inscription.verifyHalfSignedReveal` (0x81) against the
        stored content, recipient, postage, commit outpoint and commit value, and the quote's `parentReturnAddress`
        and `parentValueSats` (output 0). 0x83 reveals are refused (422 `reveal_invalid`). Stored encrypted
        (AES-256-GCM) outside the order row; never returned or emitted. Order becomes `awaiting_payment`.
      security:
        - orderToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitRevealRequest' }
      responses:
        '200':
          description: Order in `awaiting_payment`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/MintNotOpen' }
  /v1/orders/{id}/rescue:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [orders]
      operationId: getRescue
      summary: Parameters for the parent-less self-rescue ([commit] -> [child]) once `rescue_available` or `declined`.
      description: |
        Returns everything `@bsh/inscription.buildResignedRescue` needs except the ephemeral key K_e, which only the
        user's recovery bundle holds (encrypted): the browser re-signs the rescue with K_e (SIGHASH_DEFAULT) and
        broadcasts it (ADR-0005). No transaction is returned; the service cannot build one.
      security:
        - orderToken: []
      responses:
        '200':
          description: Rescue parameters, including the exact content bytes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RescueResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: Not `rescue_available` or `declined` (code `rescue_unavailable`, `details.status` = current status)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/orders/{id}/subscriptions:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [orders]
      operationId: subscribeOrder
      summary: Ask to be notified (email or Telegram) when the order needs attention or joins the club.
      description: |
        Delivered by `@bsh/notify` from the order's `degent.mint.order.{status}` events
        (contracts/asyncapi/degent-mint.yaml, "Notifications"), for exactly these transitions:
        `member_review` ("your Degent is with the club"), `declined` (the members said no; self-rescue with the
        recovery passphrase), `rescue_available` (self-rescue is open) and `delivered` ("Degent #N joined the
        club, block X"). Each (order, channel, address) is one subscription: subscribing again returns the same
        `id`. At most 3 subscriptions per order (422 `validation_failed`). Terminal orders (`rejected`,
        `delivered`, `failed`) refuse new subscriptions (409 `conflict`). A channel the deployment has not
        configured answers 503 `channel_unavailable`. `address` is used only for these notifications and is never
        returned by `GET /v1/orders/{id}` or emitted in events. Telegram: a numeric chat id (what the club bot
        replies to `/start`) or an `@channel` name; the bot must be allowed to message that chat.
      security:
        - orderToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSubscriptionRequest' }
      responses:
        '201':
          description: Subscription (new or existing)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderSubscription' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/MintNotOpen' }

  /v1/orders/{id}/votes:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [review]
      operationId: getVotes
      summary: Public vote tally and the signed votes (voters' Degent numbers, never addresses).
      responses:
        '200':
          description: Votes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VotesResponse' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [review]
      operationId: castVote
      summary: Cast a member vote on an order in `member_review`.
      description: |
        Requires a holder session (`/v1/auth/verify`). `message` must equal
        `Approve Degent order <id> (<inscriptionId or contentSha256>)` (or `Decline ...`) and `signature` must be
        a BIP-322 simple signature of it by the session address, so every vote is independently verifiable.
        Rules: one vote per address per order and one per Degent (409 `already_voted`; addresses compare in
        their canonical lower-case bech32 form, and a Degent that already voted cannot vote again from another
        address), the voter must currently hold a Degent
        (403 `not_a_holder`), a voter may not vote on an order paying their own address (403 `self_vote`),
        the order must be in `member_review` (409 `review_closed`). Reaching `APPROVAL_QUORUM` moves the
        order to `queued` and assigns its Degent number; reaching `DECLINE_QUORUM` moves it to `declined`.
      security:
        - holderSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CastVoteRequest' }
      responses:
        '200':
          description: Tally after the vote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VotesResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/MintNotOpen' }
  /v1/auth/challenge:
    post:
      tags: [auth]
      operationId: authChallenge
      summary: Issue a Sign-in-with-Bitcoin challenge (SIWB, @bsh/identity) for a holder address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthChallengeRequest' }
      responses:
        '200':
          description: Message to sign (BIP-322 simple) within its validity window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthChallengeResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/MintNotOpen' }
  /v1/auth/verify:
    post:
      tags: [auth]
      operationId: authVerify
      summary: Verify the signed challenge; returns a holder session when the address holds a Degent.
      description: |
        `verifySignIn` from @bsh/identity (domain binding, validity window, BIP-322 or legacy signature,
        single-use nonce). 401 `auth_failed` on any signature/nonce problem, 403 `not_a_holder` when the
        address holds no Degent (roster holders until the on-chain Register exists, ADR-0007).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthVerifyRequest' }
      responses:
        '200':
          description: Session token (compact JWS, EdDSA) and the Degents held
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthVerifyResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/MintNotOpen' }
  /v1/review:
    get:
      tags: [review]
      operationId: getReviewQueue
      summary: Orders awaiting member review (status `member_review`), with tallies. Holder session required.
      security:
        - holderSession: []
      responses:
        '200':
          description: Review queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewQueueResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/MintNotOpen' }
  /v1/register:
    get:
      tags: [register]
      operationId: getRegister
      summary: The Register summary - parent, gallery, member count and total bytes.
      responses:
        '200':
          description: Register summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterSummary' }
  /v1/register/{n}:
    parameters:
      - name: n
        in: path
        required: true
        schema: { type: integer, minimum: 1, maximum: 10000 }
    get:
      tags: [register]
      operationId: getRegisterMember
      summary: One Degent by number, with its inscription id, bytes and current owner.
      responses:
        '200':
          description: Member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterMember' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/register/holder/{address}:
    parameters:
      - name: address
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [register]
      operationId: getRegisterHolder
      summary: Whether an address currently holds a Degent (used by the Telegram gate). Public.
      responses:
        '200':
          description: Holder check
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolderResponse' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/register/verify/{inscriptionId}:
    parameters:
      - name: inscriptionId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9a-f]{64}i[0-9]+$' }
    get:
      tags: [register]
      operationId: verifyMembership
      summary: Is this inscription a Degent, and how (Gallery or child of the parent)?
      responses:
        '200':
          description: Membership verdict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyMembershipResponse' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/explorer:
    get:
      tags: [register]
      operationId: getExplorer
      summary: Paginated members for the Degent Explorer (image URL via ord content, bytes, height, owner).
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 48 } }
        - { name: sort, in: query, schema: { type: string, enum: [n, bytes, height], default: n } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Degent number, inscription id prefix or owner address prefix. }
        - { name: tier, in: query, schema: { $ref: '#/components/schemas/Tier' }, description: "Members whose byte size falls in that tier's range (`/v1/config` tiers). Gallery members are classified by size too." }
        - { name: minBytes, in: query, schema: { type: integer, minimum: 0 }, description: Inclusive lower bound on content length. }
        - { name: maxBytes, in: query, schema: { type: integer, minimum: 0 }, description: Inclusive upper bound on content length (422 when below minBytes). }
      responses:
        '200':
          description: Page of members (`total` counts the filtered set)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExplorerResponse' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/stats:
    get:
      tags: [register]
      operationId: getStats
      summary: Collection statistics - minted/10,000, bytes, median, per-week mints, size histogram, approvals, top holders.
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatsResponse' }

components:
  securitySchemes:
    orderToken:
      type: http
      scheme: bearer
      description: |
        The `orderToken` returned once by `POST /v1/orders`. Missing or malformed -> 401 `unauthorized`;
        wrong token for the order -> 403 `forbidden`. Compared in constant time against a stored SHA-256.
    holderSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Session token from `POST /v1/auth/verify` (compact JWS, EdDSA, audience `degent`, scope `member`).
        Missing/invalid -> 401 `unauthorized`; the address no longer holds a Degent -> 403 `not_a_holder`.
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$', examples: [dgt_4f1c2a9b0e6d7c8a1b2c3d4e] }
  headers:
    RetryAfter:
      description: Seconds until the rate-limit window resets.
      schema: { type: integer }
  responses:
    MintNotOpen:
      description: |
        Service unavailable. `mint_not_open` while the service runs with `MINT_MODE=readonly` (minting has not opened
        on this network; `retry-after` is a hint in seconds). In `full` mode this status carries the operation's own
        codes (e.g. `queue_full`, `review_unavailable`, `channel_unavailable`, `upstream_unavailable`).
      headers:
        retry-after: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error:
      description: Structured error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many POST/PUT requests from this client IP (code `rate_limited`)
      headers:
        retry-after: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Network: { type: string, enum: [mainnet, testnet, signet, regtest] }
    Tier: { type: string, enum: [standard, block] }
    Lane: { type: string, enum: [standard, block] }
    Sats: { type: integer, minimum: 0, description: Integer satoshis }
    Timestamp: { type: string, format: date-time }
    Hex32: { type: string, pattern: '^[0-9a-f]{64}$' }
    Txid: { type: string, pattern: '^[0-9a-f]{64}$' }
    OrderStatus:
      type: string
      enum:
        [awaiting_content, reviewing, approved, rejected, awaiting_payment, paid, confirming, member_review, declined,
         queued, revealing, revealed, confirmed, verified, delivered, expired, rescue_available, failed]
      description: |
        ADR-0002 §6 state machine plus the member-approval stage of ADR-0007: `paid` (commit seen) ->
        `confirming` (commit unconfirmed) -> `member_review` (commit confirmed; members vote) -> `queued`
        (approval quorum) or `declined` (decline quorum; self-rescue offered at once) or `rescue_available`
        (review SLA lapsed). Terminal: rejected, delivered, failed. `expired` can still become `paid` if the
        commit is funded late; `rescue_available` and `declined` become `revealed` when the commit is spent.
    TierRule:
      type: object
      additionalProperties: false
      required: [tier, minBytes, maxBytes, lane, label, description]
      properties:
        tier: { $ref: '#/components/schemas/Tier' }
        minBytes: { type: integer }
        maxBytes: { type: integer }
        lane: { $ref: '#/components/schemas/Lane' }
        label: { type: string }
        description: { type: string }
    CollectionConfig:
      type: object
      required: [network, collectionName, parentInscriptionId, allowedContentTypes, tiers, maxDimensionPx, minDimensionPx,
                 postageSats, serviceFeeSats, minFeeRate, quoteTtlSeconds, rescueAfterSeconds]
      properties:
        network: { $ref: '#/components/schemas/Network' }
        collectionName: { type: string }
        parentInscriptionId: { type: [string, 'null'], pattern: '^[0-9a-f]{64}i[0-9]+$' }
        allowedContentTypes:
          type: array
          items: { type: string }
          examples: [[image/png, image/jpeg, image/webp, image/avif, image/gif]]
        tiers: { type: array, items: { $ref: '#/components/schemas/TierRule' } }
        maxDimensionPx: { type: integer, examples: [4096] }
        minDimensionPx: { type: integer, examples: [256] }
        postageSats: { $ref: '#/components/schemas/Sats' }
        serviceFeeSats:
          type: object
          additionalProperties: false
          required: [standard, block]
          properties:
            standard: { $ref: '#/components/schemas/Sats' }
            block: { $ref: '#/components/schemas/Sats' }
        minFeeRate: { type: number, description: sat/vB }
        quoteTtlSeconds: { type: integer }
        rescueAfterSeconds: { type: integer }
    MintMode:
      type: string
      enum: [full, readonly]
      description: '`full`: orders open. `readonly`: site and Register only; write routes answer 503 `mint_not_open`.'
    ServiceConfig:
      allOf:
        - $ref: '#/components/schemas/CollectionConfig'
        - type: object
          required: [mode, collectionAddress, serviceFeeAddress, maxUploadBytes]
          properties:
            mode: { $ref: '#/components/schemas/MintMode' }
            collectionAddress: { type: string, description: 'Taproot address holding the parent (parent return output). Empty in `readonly` mode when none is configured.' }
            serviceFeeAddress: { type: [string, 'null'] }
            maxUploadBytes: { type: integer, examples: [4194304] }
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [tier, contentType, contentLength, contentSha256, recipientAddress, revealPubkey, feeRate]
      properties:
        tier: { $ref: '#/components/schemas/Tier' }
        contentType: { type: string, maxLength: 100 }
        contentLength: { type: integer, minimum: 1 }
        contentSha256: { $ref: '#/components/schemas/Hex32' }
        recipientAddress: { type: string, description: Taproot ordinals address on the service network. }
        revealPubkey: { allOf: [{ $ref: '#/components/schemas/Hex32' }], description: Ephemeral x-only key K_e generated in the browser. }
        feeRate: { type: number, exclusiveMinimum: 0, description: 'sat/vB, at most 3 decimals' }
    CreateOrderResponse:
      type: object
      additionalProperties: false
      required: [order, orderToken]
      properties:
        order: { $ref: '#/components/schemas/Order' }
        orderToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: 256-bit base64url bearer secret, returned once. Store it with the local recovery bundle.
    Quote:
      type: object
      additionalProperties: false
      required: [tier, lane, feeRate, revealWeight, revealVsize, revealFeeSats, postageSats, serviceFeeSats,
                 commitValueSats, totalSats, commitAddress, binding, expiresAt, queuePosition, etaMinutes,
                 parentReturnAddress, parentValueSats]
      properties:
        tier: { $ref: '#/components/schemas/Tier' }
        lane: { $ref: '#/components/schemas/Lane' }
        feeRate: { type: number }
        revealWeight: { type: integer, description: Exact weight (WU) of the final parent-linked reveal. }
        revealVsize: { type: integer }
        revealFeeSats: { $ref: '#/components/schemas/Sats' }
        postageSats: { $ref: '#/components/schemas/Sats' }
        serviceFeeSats: { $ref: '#/components/schemas/Sats' }
        commitValueSats: { allOf: [{ $ref: '#/components/schemas/Sats' }], description: revealFee + postage; exact amount for the commit output. }
        totalSats: { allOf: [{ $ref: '#/components/schemas/Sats' }], description: commitValue + serviceFee (funding tx fee excluded). }
        commitAddress: { type: [string, 'null'], description: Null on the indicative quote. }
        binding: { type: boolean }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        queuePosition: { type: [integer, 'null'] }
        etaMinutes: { type: [integer, 'null'] }
        parentReturnAddress:
          type: string
          description: Output 0 of the reveal (the collection address holding the parent). Signed by the browser (0x81).
        parentValueSats:
          type: [integer, 'null']
          minimum: 1
          description: |
            Exact value of output 0 (= the parent UTXO's value, constant across reveals). Signed by the browser (0x81).
            Always set on the binding quote; null on an indicative quote while the service does not know its parent UTXO.
    ReviewCheck:
      type: object
      additionalProperties: false
      required: [id, passed, detail]
      properties:
        id: { type: string }
        passed: { type: boolean }
        detail: { type: string }
    ReviewResult:
      type: object
      additionalProperties: false
      required: [approved, reasons, checks]
      properties:
        approved: { type: boolean }
        reasons: { type: array, items: { type: string } }
        checks: { type: array, items: { $ref: '#/components/schemas/ReviewCheck' } }
        rules: { $ref: '#/components/schemas/MintingRulesAdvice' }
      description: >-
        `approved`/`reasons` are the hard verdict (file rules and safety categories only). `rules` is ADVISORY:
        it never rejects; the collector sees it before paying and members see it in `GET /v1/review`.
        Absent on reviews stored before advisory rules existed.
    RuleVerdict:
      type: string
      enum: [pass, fail, unknown]
      description: '`unknown` = not assessed (no vision review, unsupported image type, or the model could not tell).'
    MintingRulesAdvice:
      type: object
      additionalProperties: false
      required: [square, pepeInTuxWithBowtie, framedWithPlacard, placardText, notes]
      description: >-
        Advisory check of the site's Minting Rules. `square` is exact (from the decoded image header); the others
        come from the optional vision review. Never affects `ReviewResult.approved`.
      properties:
        square: { $ref: '#/components/schemas/RuleVerdict' }
        pepeInTuxWithBowtie: { $ref: '#/components/schemas/RuleVerdict' }
        framedWithPlacard: { $ref: '#/components/schemas/RuleVerdict' }
        placardText:
          type: [string, 'null']
          enum: [DEGEN, DEGENT, REGEN, null]
          description: Accepted placard text read on the image; null when absent, unreadable or not assessed.
        notes:
          type: object
          additionalProperties: false
          required: [square, pepeInTuxWithBowtie, framedWithPlacard]
          properties:
            square: { type: string, maxLength: 200 }
            pepeInTuxWithBowtie: { type: string, maxLength: 200 }
            framedWithPlacard: { type: string, maxLength: 200 }
    OrderEvent:
      type: object
      additionalProperties: false
      required: [status, at]
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        at: { $ref: '#/components/schemas/Timestamp' }
        detail: { type: string }
        txid: { $ref: '#/components/schemas/Txid' }
    QueueInfo:
      type: object
      additionalProperties: false
      required: [lane, position, etaMinutes]
      properties:
        lane: { $ref: '#/components/schemas/Lane' }
        position: { type: [integer, 'null'] }
        etaMinutes: { type: [integer, 'null'] }
    Outpoint:
      type: object
      additionalProperties: false
      required: [txid, vout]
      properties:
        txid: { $ref: '#/components/schemas/Txid' }
        vout: { type: integer, minimum: 0 }
    Order:
      type: object
      additionalProperties: false
      required: [id, network, status, tier, contentType, contentLength, contentSha256, recipientAddress, revealPubkey,
                 quote, review, commitOutpoint, revealTxid, inscriptionId, rescued, serviceFeeAddress, queue, approval,
                 degentNumber, timeline, createdAt, updatedAt]
      properties:
        id: { type: string }
        network: { $ref: '#/components/schemas/Network' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        tier: { $ref: '#/components/schemas/Tier' }
        contentType: { type: string }
        contentLength: { type: integer }
        contentSha256: { $ref: '#/components/schemas/Hex32' }
        recipientAddress: { type: string }
        revealPubkey: { $ref: '#/components/schemas/Hex32' }
        quote: { oneOf: [{ $ref: '#/components/schemas/Quote' }, { type: 'null' }] }
        review: { oneOf: [{ $ref: '#/components/schemas/ReviewResult' }, { type: 'null' }] }
        commitOutpoint: { oneOf: [{ $ref: '#/components/schemas/Outpoint' }, { type: 'null' }] }
        revealTxid: { type: [string, 'null'] }
        inscriptionId: { type: [string, 'null'], description: '"<revealTxid>i0"' }
        rescued: { type: boolean, description: True when the child landed via self-rescue (no parent link). }
        serviceFeeAddress: { type: [string, 'null'] }
        queue: { oneOf: [{ $ref: '#/components/schemas/QueueInfo' }, { type: 'null' }], description: Set while queued. }
        approval: { oneOf: [{ $ref: '#/components/schemas/ApprovalInfo' }, { type: 'null' }], description: Public tally; set from member_review on. }
        degentNumber: { type: [integer, 'null'], description: '4112 + approval rank, assigned at the approval quorum.' }
        timeline: { type: array, items: { $ref: '#/components/schemas/OrderEvent' } }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    SubmitRevealRequest:
      type: object
      additionalProperties: false
      required: [commitTxid, commitVout, halfSignedRevealPsbt]
      properties:
        commitTxid: { type: string, pattern: '^[0-9a-fA-F]{64}$', description: Txid of the (unsigned) funding tx. }
        commitVout: { type: integer, minimum: 0, maximum: 4294967295 }
        halfSignedRevealPsbt: { type: string, contentEncoding: base64, description: '[commit] -> [parent return, child] PSBT, commit input signed with SIGHASH_ALL|ANYONECANPAY (0x81). Max request body 8 MiB.' }
        commitAddress: { type: string, description: Optional browser-computed commit address; must equal the quote's. }
    NotifyChannel: { type: string, enum: [email, telegram_chat] }
    NotifyStatus:
      type: string
      enum: [member_review, declined, rescue_available, delivered]
      description: The order statuses that notify a subscriber.
    CreateSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [channel, address]
      properties:
        channel: { $ref: '#/components/schemas/NotifyChannel' }
        address:
          type: string
          minLength: 1
          maxLength: 254
          description: Email address (`email`) or Telegram chat id / `@channel` (`telegram_chat`).
          examples: [gent@example.com, '123456789']
    OrderSubscription:
      type: object
      additionalProperties: false
      required: [id, orderId, channel, address, events, createdAt]
      properties:
        id: { type: string, pattern: '^sub_[0-9a-f]{24}$' }
        orderId: { type: string }
        channel: { $ref: '#/components/schemas/NotifyChannel' }
        address: { type: string }
        events: { type: array, items: { $ref: '#/components/schemas/NotifyStatus' } }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    RescueResponse:
      type: object
      additionalProperties: false
      description: |
        Inputs of `buildResignedRescue` except K_e. The browser must check `sha256(content) == contentSha256` and that
        its decrypted K_e matches `revealPubkey` before signing. `weight`/`vsize`/`feeSats` describe the re-signed
        rescue exactly (`estimateResignedRescueWeight`); `feeSats` = commitValue - postage (no change output).
      required: [orderId, network, method, commitOutpoint, commitValueSats, recipientAddress, postageSats, contentType,
                 contentSha256, contentBase64, parentInscriptionId, revealPubkey, feeRate, weight, vsize, feeSats]
      properties:
        orderId: { type: string }
        network: { $ref: '#/components/schemas/Network' }
        method: { type: string, enum: [resign], description: 'Re-sign [commit] -> [child] with K_e (SIGHASH_DEFAULT), ADR-0005.' }
        commitOutpoint: { $ref: '#/components/schemas/Outpoint' }
        commitValueSats: { $ref: '#/components/schemas/Sats' }
        recipientAddress: { type: string }
        postageSats: { $ref: '#/components/schemas/Sats' }
        contentType: { type: string }
        contentSha256: { $ref: '#/components/schemas/Hex32' }
        contentBase64: { type: string, contentEncoding: base64, description: The exact inscribed bytes. }
        parentInscriptionId: { type: [string, 'null'], description: Parent id in the envelope (tag 3); part of the commit address. }
        revealPubkey: { $ref: '#/components/schemas/Hex32' }
        feeRate: { type: number, description: 'Quoted sat/vB; the rescue pays at least this (it is lighter than the parent reveal).' }
        weight: { type: integer }
        vsize: { type: integer }
        feeSats: { $ref: '#/components/schemas/Sats' }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, network, mode, version, time, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        network: { $ref: '#/components/schemas/Network' }
        mode: { $ref: '#/components/schemas/MintMode' }
        version: { type: string }
        time: { $ref: '#/components/schemas/Timestamp' }
        checks:
          type: object
          additionalProperties:
            type: object
            required: [ok]
            properties:
              ok: { type: boolean }
              detail: { type: string }
    FeesResponse:
      type: object
      additionalProperties: false
      required: [network, minFeeRate, standard, block, fetchedAt]
      properties:
        network: { $ref: '#/components/schemas/Network' }
        minFeeRate: { type: number }
        standard:
          type: object
          required: [slow, normal, fast]
          properties:
            slow: { type: number }
            normal: { type: number }
            fast: { type: number }
        block:
          type: object
          required: [min, recommended]
          properties:
            min: { type: number }
            recommended: { type: number }
        fetchedAt: { $ref: '#/components/schemas/Timestamp' }
    LaneQueue:
      type: object
      additionalProperties: false
      required: [lane, waiting, inFlight, capacity, etaMinutesForNext]
      properties:
        lane: { $ref: '#/components/schemas/Lane' }
        waiting: { type: integer }
        inFlight: { type: integer }
        capacity: { type: integer }
        etaMinutesForNext: { type: [integer, 'null'] }
    QueueResponse:
      type: object
      additionalProperties: false
      required: [standard, block, tipHeight]
      properties:
        standard: { $ref: '#/components/schemas/LaneQueue' }
        block: { $ref: '#/components/schemas/LaneQueue' }
        tipHeight: { type: [integer, 'null'] }
    InscriptionId: { type: string, pattern: '^[0-9a-f]{64}i[0-9]+$' }
    VoteChoice: { type: string, enum: [approve, decline] }
    ApprovalInfo:
      type: object
      additionalProperties: false
      required: [approvals, declines, approvalQuorum, declineQuorum, reviewStartedAt, reviewDeadline]
      properties:
        approvals: { type: integer, minimum: 0 }
        declines: { type: integer, minimum: 0 }
        approvalQuorum: { type: integer, minimum: 1 }
        declineQuorum: { type: integer, minimum: 1 }
        reviewStartedAt: { type: [string, 'null'], format: date-time }
        reviewDeadline: { type: [string, 'null'], format: date-time, description: When the review SLA lapses and self-rescue is offered. }
    PublicVote:
      type: object
      additionalProperties: false
      required: [degent, vote, at, signature, message]
      properties:
        degent: { type: integer, minimum: 1, description: The voter's Degent number (their membership), never their address. }
        vote: { $ref: '#/components/schemas/VoteChoice' }
        at: { $ref: '#/components/schemas/Timestamp' }
        signature: { type: string, description: BIP-322 simple signature (base64) over `message`. }
        message: { type: string }
    VotesResponse:
      type: object
      additionalProperties: false
      required: [orderId, status, approval, votes]
      properties:
        orderId: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        approval: { $ref: '#/components/schemas/ApprovalInfo' }
        votes: { type: array, items: { $ref: '#/components/schemas/PublicVote' } }
    CastVoteRequest:
      type: object
      additionalProperties: false
      required: [vote, message, signature]
      properties:
        vote: { $ref: '#/components/schemas/VoteChoice' }
        message: { type: string, maxLength: 280, description: '`Approve Degent order <id> (<inscriptionId or contentSha256>)` or `Decline ...`' }
        signature: { type: string, maxLength: 512, description: BIP-322 simple signature (base64) by the session address. }
    ReviewItem:
      type: object
      additionalProperties: false
      required: [order, approval, voted]
      properties:
        order: { $ref: '#/components/schemas/Order' }
        approval: { $ref: '#/components/schemas/ApprovalInfo' }
        voted: { oneOf: [{ $ref: '#/components/schemas/VoteChoice' }, { type: 'null' }] }
    ReviewQueueResponse:
      type: object
      additionalProperties: false
      required: [items, memberDegents]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReviewItem' } }
        memberDegents: { type: array, items: { type: integer } }
    AuthChallengeRequest:
      type: object
      additionalProperties: false
      required: [address]
      properties:
        address: { type: string, description: Taproot or segwit address on the service network. }
    AuthChallengeResponse:
      type: object
      additionalProperties: false
      required: [message, expiresAt]
      properties:
        message: { type: string, description: SIWB message (EIP-4361 style) to sign with BIP-322 simple. }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
    AuthVerifyRequest:
      type: object
      additionalProperties: false
      required: [address, message, signature]
      properties:
        address: { type: string }
        message: { type: string, maxLength: 4096 }
        signature: { type: string, maxLength: 1024, description: base64 BIP-322 simple witness (or legacy signmessage). }
    AuthVerifyResponse:
      type: object
      additionalProperties: false
      required: [token, address, degents, expiresAt]
      properties:
        token: { type: string }
        address: { type: string }
        degents: { type: array, items: { type: integer } }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
    MembershipVia: { type: string, enum: [gallery, child] }
    RegisterMember:
      type: object
      additionalProperties: false
      required: [n, id, number, via, bytes, height, sat, owner, contentUrl]
      properties:
        n: { type: integer, minimum: 1, maximum: 10000 }
        id: { $ref: '#/components/schemas/InscriptionId' }
        number: { type: [integer, 'null'] }
        via: { $ref: '#/components/schemas/MembershipVia' }
        bytes: { type: integer, minimum: 0 }
        height: { type: [integer, 'null'] }
        sat: { type: [integer, 'null'] }
        owner: { type: [string, 'null'], description: Current holder address when the indexer knows it. }
        contentUrl: { type: string, description: ord `/content/<id>` URL for rendering. }
    RegisterSummary:
      type: object
      additionalProperties: false
      required: [parent, gallery, count, bytes, pending, updatedAt]
      properties:
        parent: { type: [string, 'null'] }
        gallery: { type: [string, 'null'], description: Inscription id of the signed Gallery (first 4,112), once inscribed. }
        count: { type: integer }
        bytes: { type: integer }
        pending: { type: integer, description: Approved by vote, not yet delivered on chain. }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    HolderResponse:
      type: object
      additionalProperties: false
      required: [address, holder, degents]
      properties:
        address: { type: string }
        holder: { type: boolean }
        degents: { type: array, items: { type: integer } }
    VerifyMembershipResponse:
      type: object
      additionalProperties: false
      required: [id, member, via, n]
      properties:
        id: { $ref: '#/components/schemas/InscriptionId' }
        member: { type: boolean }
        via: { oneOf: [{ $ref: '#/components/schemas/MembershipVia' }, { type: 'null' }] }
        n: { type: [integer, 'null'] }
    ExplorerResponse:
      type: object
      additionalProperties: false
      required: [items, total, offset, limit, sort, order]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RegisterMember' } }
        total: { type: integer }
        offset: { type: integer }
        limit: { type: integer }
        sort: { type: string, enum: [n, bytes, height] }
        order: { type: string, enum: [asc, desc] }
    HistogramBucket:
      type: object
      additionalProperties: false
      required: [from, to, count]
      properties:
        from: { type: integer }
        to: { type: [integer, 'null'] }
        count: { type: integer }
    WeekBucket:
      type: object
      additionalProperties: false
      required: [week, count]
      properties:
        week: { type: string, description: ISO date of the week's Monday. }
        count: { type: integer }
    StatsResponse:
      type: object
      additionalProperties: false
      required: [minted, charter, totalBytes, medianBytes, mintsPerWeek, sizeHistogram, approvals, topHolders, updatedAt]
      properties:
        minted: { type: integer }
        charter: { type: integer, examples: [10000] }
        totalBytes: { type: integer }
        medianBytes: { type: number }
        mintsPerWeek: { type: array, items: { $ref: '#/components/schemas/WeekBucket' } }
        sizeHistogram: { type: array, items: { $ref: '#/components/schemas/HistogramBucket' } }
        approvals:
          type: object
          additionalProperties: false
          required: [inReview, approved, declined, perWeek, medianSecondsToQuorum]
          properties:
            inReview: { type: integer }
            approved: { type: integer }
            declined: { type: integer }
            perWeek: { type: array, items: { $ref: '#/components/schemas/WeekBucket' } }
            medianSecondsToQuorum: { type: [number, 'null'] }
        topHolders:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [owner, count]
            properties:
              owner: { type: string }
              count: { type: integer }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    ErrorCode:
      type: string
      enum:
        [bad_request, unauthorized, forbidden, validation_failed, not_found, conflict, quote_expired, payload_too_large,
         unsupported_media_type, rate_limited, forbidden_origin, content_mismatch, reveal_invalid,
         rescue_unavailable, review_unavailable, queue_full, upstream_unavailable, channel_unavailable, internal,
         not_a_holder, already_voted, self_vote, vote_invalid, auth_failed, review_closed, mint_not_open]
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            details: {}
