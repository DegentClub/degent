openapi: 3.1.0
info:
  title: block.space collection certification
  version: 0.1.0
  summary: '"Verified by block.space": signed, reproducible membership and size statistics for inscription collections.'
  description: |
    Provided by `@bsh/blockspace-certify` (products/blockspace/services/certify).

    A collection's membership is resolved from two sources:

    - **parent-children**: every inscription that ord lists as a child of the collection's parent
      inscription and whose own record links back to that parent;
    - **manifest**: a legacy list `{ collection, items: [{ inscriptionId, sha256?, contentLength? }] }`
      that counts only once it is itself inscribed as a child of the collection parent (i.e. signed by
      whoever controls the parent). An uninscribed manifest is reported with `verified: false` and its
      items are not counted.

    Every refresh produces an **attestation**: the statistics, the sources used and the block height
    they are valid at, signed with BIP340 Schnorr over
    `taggedHash("block.space/collection-attestation/v1", canonicalJson(attestation without signature))`,
    where `taggedHash(t, m) = sha256(sha256(t) || sha256(t) || m)` and canonical JSON is RFC 8785
    (JCS) for the value domain used here: object keys sorted by UTF-16 code units, no insignificant
    whitespace, ECMAScript number serialisation. Public keys are served at `GET /v1/keys`.

    All errors use the `Error` schema (the `@bsh/edge` body) and every response carries
    `X-Request-Id`. Reads are public, CORS-open (`*`, no credentials) and rate-limited per client IP
    (429 `rate_limited` with `Retry-After`); `refresh` needs the admin bearer token.
  license:
    name: Proprietary
servers:
  - url: https://certify.block.space
    description: production (provisional hostname)
tags:
  - name: meta
  - name: collections
paths:
  /v1/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Liveness plus ord reachability.
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Always 200 while the process serves; `status` is `degraded` when ord is unreachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /v1/keys:
    get:
      tags: [meta]
      operationId: listKeys
      summary: Public keys that sign attestations.
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Active signing key(s).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeysResponse' }
  /v1/collections/{slug}:
    get:
      tags: [collections]
      operationId: getCollection
      summary: Latest signed attestation for a collection.
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Latest attestation, its digest, and the inscriptions that were considered but excluded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/collections/{slug}/refresh:
    post:
      tags: [collections]
      operationId: refreshCollection
      summary: Re-resolve membership against ord, recompute statistics and issue a new attestation.
      description: |
        Synchronous: the response is sent when the new attestation is stored. One refresh per
        collection at a time (a concurrent call gets 409). No request body.
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: The new attestation (same shape as `GET /v1/collections/{slug}`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '401':
          description: Missing or wrong admin token (`unauthorized`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A refresh for this collection is already running (`refresh_in_progress`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: The configured manifest or parent is invalid (`manifest_invalid`, `manifest_not_found`, `parent_not_found`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: ord failed or returned an unexpected shape (`upstream_error`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/collections/{slug}/items:
    get:
      tags: [collections]
      operationId: listCollectionItems
      summary: Members of the latest attestation, ordered by inscription number then id.
      parameters:
        - $ref: '#/components/parameters/Slug'
        - name: cursor
          in: query
          required: false
          description: Opaque `nextCursor` from the previous page. Keyset-based, so it stays valid across refreshes.
          schema: { type: string, maxLength: 256 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: One page of members.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemsPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: Operator token (secret path `services/blockspace-certify/admin-token`).
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Slug' }
  responses:
    TooManyRequests:
      description: Per-IP rate limit exceeded (`rate_limited`); see `Retry-After`.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Request body over 1 KiB (`payload_too_large`); refresh takes no body.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Malformed slug, cursor or limit (`bad_request`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Unknown collection (`collection_not_found`) or no attestation issued yet (`not_certified`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Slug:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
      examples: [degent]
    InscriptionId:
      type: string
      pattern: '^[0-9a-f]{64}i[0-9]+$'
    Hex32:
      type: string
      pattern: '^[0-9a-f]{64}$'
    Error:
      description: The platform-wide error body produced by `@bsh/edge`.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum:
                - bad_request
                - unauthorized
                - not_found
                - collection_not_found
                - not_certified
                - refresh_in_progress
                - manifest_invalid
                - manifest_not_found
                - parent_not_found
                - upstream_error
                - rate_limited
                - payload_too_large
                - internal_error
            message:
              type: string
              description: Human-readable; never contains internals for 5xx.
            requestId:
              type: [string, 'null']
              description: Same value as the `X-Request-Id` response header.
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version, time, keyId, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string, const: blockspace-certify }
        version: { type: string }
        time: { type: string, format: date-time }
        keyId: { type: string }
        checks:
          type: object
          additionalProperties: false
          required: [ord]
          properties:
            ord:
              type: object
              additionalProperties: false
              required: [ok]
              properties:
                ok: { type: boolean }
                detail: { type: string }
    SigningKey:
      type: object
      additionalProperties: false
      required: [keyId, algorithm, publicKey, tag, status]
      properties:
        keyId:
          type: string
          description: First 8 bytes (16 hex) of sha256(publicKey).
          pattern: '^[0-9a-f]{16}$'
        algorithm: { type: string, const: bip340-schnorr-secp256k1 }
        publicKey:
          description: 32-byte x-only public key, hex.
          allOf: [{ $ref: '#/components/schemas/Hex32' }]
        tag: { type: string, const: block.space/collection-attestation/v1 }
        status: { type: string, enum: [active, retired] }
    KeysResponse:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: '#/components/schemas/SigningKey' }
    CollectionRef:
      type: object
      additionalProperties: false
      required: [slug, name, parentInscriptionId]
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string }
        parentInscriptionId:
          oneOf:
            - $ref: '#/components/schemas/InscriptionId'
            - type: 'null'
    ParentSource:
      type: object
      additionalProperties: false
      required: [type, parentInscriptionId, pages, listed, accepted, excluded]
      properties:
        type: { type: string, const: parent-children }
        parentInscriptionId: { $ref: '#/components/schemas/InscriptionId' }
        pages: { type: integer, minimum: 0, description: Children pages fetched from ord. }
        listed: { type: integer, minimum: 0, description: Distinct child ids ord listed. }
        accepted: { type: integer, minimum: 0 }
        excluded: { type: integer, minimum: 0 }
    ManifestSource:
      type: object
      additionalProperties: false
      required: [type, manifestInscriptionId, manifestSha256, verified, listed, accepted, excluded]
      properties:
        type: { type: string, const: manifest }
        manifestInscriptionId:
          description: Where the manifest is inscribed; null while it exists only off-chain.
          oneOf:
            - $ref: '#/components/schemas/InscriptionId'
            - type: 'null'
        manifestSha256:
          description: sha256 of the canonical JSON of the manifest that was evaluated.
          allOf: [{ $ref: '#/components/schemas/Hex32' }]
        verified:
          type: boolean
          description: True only when the manifest is inscribed as a child of the collection parent.
        listed: { type: integer, minimum: 0 }
        accepted: { type: integer, minimum: 0 }
        excluded: { type: integer, minimum: 0 }
    Stats:
      type: object
      additionalProperties: false
      required:
        - itemCount
        - excludedCount
        - totalContentBytes
        - minItemBytes
        - maxItemBytes
        - medianItemBytes
        - firstInscriptionNumber
        - lastInscriptionNumber
        - totalRevealVbytes
        - revealTxCount
        - itemsDigest
      properties:
        itemCount: { type: integer, minimum: 0 }
        excludedCount: { type: integer, minimum: 0, description: Distinct ids considered but not members. }
        totalContentBytes: { type: integer, minimum: 0, description: Sum of ord content_length (null counts as 0). }
        minItemBytes: { type: [integer, 'null'] }
        maxItemBytes: { type: [integer, 'null'] }
        medianItemBytes:
          type: [number, 'null']
          description: Middle value; for an even count, the mean of the two middle values (may end in .5).
        firstInscriptionNumber: { type: [integer, 'null'] }
        lastInscriptionNumber: { type: [integer, 'null'] }
        totalRevealVbytes:
          type: [integer, 'null']
          description: Sum of vsize over the distinct reveal transactions of all members; null when any could not be sized.
        revealTxCount: { type: [integer, 'null'] }
        itemsDigest:
          description: sha256 hex of canonicalJson([[inscriptionId, number, contentLength], ...]) in item order.
          allOf: [{ $ref: '#/components/schemas/Hex32' }]
    Attestation:
      type: object
      additionalProperties: false
      required: [collection, method, sources, stats, asOfBlockHeight, issuedAt, keyId, signature]
      properties:
        collection: { $ref: '#/components/schemas/CollectionRef' }
        method: { type: string, enum: [parent-children, manifest, parent-children+manifest] }
        sources:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/ParentSource'
              - $ref: '#/components/schemas/ManifestSource'
        stats: { $ref: '#/components/schemas/Stats' }
        asOfBlockHeight: { type: integer, minimum: 0, description: ord block height read at the start of the refresh; later inscriptions are excluded. }
        issuedAt: { type: string, format: date-time }
        keyId: { type: string, pattern: '^[0-9a-f]{16}$' }
        signature: { type: string, pattern: '^[0-9a-f]{128}$', description: BIP340 signature over `digest`. }
    Exclusion:
      type: object
      additionalProperties: false
      required: [inscriptionId, source, reason]
      properties:
        inscriptionId: { $ref: '#/components/schemas/InscriptionId' }
        source: { type: string, enum: [parent-children, manifest] }
        reason:
          type: string
          enum:
            - not_found
            - parent_link_missing
            - after_as_of_height
            - content_length_mismatch
            - sha256_mismatch
            - content_unavailable
        detail: { type: string }
    CollectionResponse:
      type: object
      additionalProperties: false
      required: [attestation, digest, exclusions]
      properties:
        attestation: { $ref: '#/components/schemas/Attestation' }
        digest:
          description: The 32-byte message that was signed (convenience; recompute it to verify).
          allOf: [{ $ref: '#/components/schemas/Hex32' }]
        exclusions:
          type: array
          items: { $ref: '#/components/schemas/Exclusion' }
    Item:
      type: object
      additionalProperties: false
      required: [inscriptionId, number, contentLength, contentType, height, sources]
      properties:
        inscriptionId: { $ref: '#/components/schemas/InscriptionId' }
        number: { type: integer }
        contentLength: { type: integer, minimum: 0 }
        contentType: { type: [string, 'null'] }
        height: { type: integer, minimum: 0 }
        sources:
          type: array
          minItems: 1
          items: { type: string, enum: [parent-children, manifest] }
    ItemsPage:
      type: object
      additionalProperties: false
      required: [slug, asOfBlockHeight, itemsDigest, items, nextCursor]
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        asOfBlockHeight: { type: integer, minimum: 0 }
        itemsDigest: { $ref: '#/components/schemas/Hex32' }
        items:
          type: array
          items: { $ref: '#/components/schemas/Item' }
        nextCursor: { type: [string, 'null'] }
