openapi: 3.1.0
info:
  title: degent.club Artist Studio API
  version: 0.1.0
  summary: Open studio for the Decentralized Gentlemen Club - artist identity, artwork submission and review, public gallery, royalty view.
  description: |
    Implemented by `@bsh/degent-studio` (products/degent/services/studio). Design: docs/adr/0007-open-studio.md.
    Rules come from `@bsh/degent-mint-sdk` (`DEGENT_RULES`, `DEGENT_RULES_CONFIG`, `contracts/schemas/degent-rules.json`).

    Flow: `POST /v1/auth/challenge` (SIWB message) -> wallet signs (BIP-322 simple, or legacy signmessage) ->
    `POST /v1/auth/verify` (session JWT, product `degent`, scope `artist`) -> `PUT /v1/artists/me` (display name;
    payout address proven by a BIP-322 simple signature over `degent.club payout address <address> for <sessionSub>`)
    -> `POST /v1/artworks` (declaration, one-time `uploadToken`) -> `PUT /v1/artworks/{id}/content` (exact bytes;
    the review runs ONCE here: rules on the real bytes, then the vision model; a skipped or unavailable vision check
    never approves, it leaves the artwork `reviewing` with `needsHuman: true`) -> the house resolves with
    `POST /v1/artworks/{id}/review` -> approved artworks appear in `GET /v1/artworks` and serve their bytes at
    `GET /v1/artworks/{id}/content` (immutable, ETag = sha256). The mint service reads approved artworks and posts
    `POST /v1/internal/royalties` after each mint; artists see them at `GET /v1/artists/me/royalties`.

    Statuses: `submitted` -> `reviewing` -> `approved` | `rejected`; `approved` -> `delisted` (artist) or
    `rejected` (house); `rejected` -> `approved` (house); `rejected` -> `reviewing` (the artist's appeal,
    `POST /v1/artworks/{id}/appeal`, detail `appeal`). Every transition is emitted as `degent.artwork.{status}`
    (contracts/asyncapi/degent-studio.yaml).

    Editions, curation, appeals and notifications (ADR-0012): an artwork may carry `maxEditions` (1-10000, null =
    open edition); `mintedEditions` counts the royalty records the mint posted and `soldOut` is true once it
    reaches the cap (`GET /v1/artworks?available=true` hides sold-out pieces). The house orders the gallery front
    room with `featuredRank`. A rejected artwork can be appealed (one open appeal at a time, at most 3 per
    artwork; the house queue is `GET /v1/appeals`). Artists may register a webhook and/or a Telegram chat on their
    profile; the studio notifies them when an artwork is approved, rejected or waits for a human, and when a
    royalty is recorded (`webhooks.artistNotification`). A failed notification never fails the request that
    triggered it.

    Conventions: amounts are integer sats as JSON numbers; timestamps are ISO 8601 UTC; hashes are lowercase hex.
    Every error is `{ "error": { "code", "message", "requestId", "details"? } }` (`@bsh/edge` shape). Browser
    calls are subject to a CORS allowlist (default deny). Mutating requests are rate limited per client IP.
    JSON responses carry `cache-control: no-store`; approved content is `public, max-age=31536000, immutable`.
  license: { name: Proprietary, identifier: LicenseRef-Proprietary }
servers:
  - url: https://studio.degent.club
    description: production (mainnet)
  - url: http://127.0.0.1:8790
    description: local dev (regtest)
tags:
  - name: service
  - name: auth
  - name: artists
  - name: artworks
  - name: appeals
  - name: internal
security: []
paths:
  /v1/health:
    get:
      tags: [service]
      operationId: getHealth
      summary: Liveness plus dependency checks (always 200; see `status`).
      responses:
        '200':
          description: Health report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /v1/config:
    get:
      tags: [service]
      operationId: getConfig
      summary: The published rules, accepted formats, limits and the SIWB / payout-proof parameters a client needs.
      responses:
        '200':
          description: Studio configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigResponse' }
  /v1/auth/challenge:
    post:
      tags: [auth]
      operationId: createChallenge
      summary: Issue a Sign-in-with-Bitcoin challenge for an address (nonce bound to domain + address, single use).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChallengeRequest' }
      responses:
        '201':
          description: Challenge message to sign with the wallet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengeResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/verify:
    post:
      tags: [auth]
      operationId: verifySignIn
      summary: Verify the signed challenge and issue an artist session (JWT, product `degent`, scope `artist`).
      description: |
        Verified with `@bsh/identity.verifySignIn` (grammar, domain, address, network, validity window,
        BIP-322 simple or legacy signature, then the nonce is consumed). The artist profile is created on
        first sign-in. Failure is 401 `sign_in_failed` with `details.reason` (one of the identity error codes).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyRequest' }
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/artists/me:
    get:
      tags: [artists]
      operationId: getMe
      summary: The signed-in artist's own profile (includes the payout address).
      security:
        - session: []
      responses:
        '200':
          description: Artist profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artist' }
        '401': { $ref: '#/components/responses/Error' }
    put:
      tags: [artists]
      operationId: updateMe
      summary: Update display name and/or the payout address (proven by a BIP-322 simple signature).
      description: |
        `payout.address` must be a segwit (P2WPKH) or taproot (P2TR) address on the service network; legacy
        P2PKH / P2SH addresses are refused with 422 `payout_address_legacy`. `payout.signature` is a BIP-322
        simple signature by that address over the exact text `degent.club payout address <address> for <sessionSub>`
        (`payoutMessageTemplate` in `GET /v1/config`); an invalid proof is 422 `payout_proof_invalid`.

        `notify` registers where the studio notifies the artist (ADR-0012): `webhookUrl` (https, no embedded
        credentials, no localhost / private literal IPs; validated by `@bsh/notify`) and/or `telegramChatId`
        (only when `notifyChannels` in `GET /v1/config` lists `telegram`). A field left out is unchanged, `null`
        clears it, `notify: null` clears both. The first time a webhook is set (or with `rotateWebhookSecret:
        true`) the studio generates the artist's webhook signing secret and returns it ONCE in
        `notifyWebhookSecret`; deliveries carry `Bsh-Signature: t=<unix>,v1=<HMAC-SHA256(secret, "<t>.<raw body>")>`.
        Clearing the webhook deletes the secret.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateArtistRequest' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artist' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/artists/me/royalties:
    get:
      tags: [artists]
      operationId: getMyRoyalties
      summary: Mint records that paid this artist a royalty (newest first) plus totals over all records.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Royalty records and totals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoyaltiesResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/artists/{address}:
    parameters:
      - $ref: '#/components/parameters/ArtistAddress'
    get:
      tags: [artists]
      operationId: getArtist
      summary: Public artist profile.
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicArtist' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/artworks:
    get:
      tags: [artworks]
      operationId: listArtworks
      summary: Gallery listing - `featuredRank` ascending (unranked last), then featured, then newest. Public for `approved`; other statuses need the owner's session or an API key.
      security:
        - {}
        - session: []
        - apiKey: []
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ArtworkStatus' }
          description: Default `approved`. Anything else requires the owner's session (with `artist` = the session address) or an API key.
        - name: artist
          in: query
          schema: { type: string, maxLength: 90 }
          description: Filter by artist address.
        - name: available
          in: query
          schema: { type: boolean }
          description: |
            `true`: only artworks that can still be minted (not `soldOut`); `false`: only sold-out artworks.
            Omitted: no edition filter.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of artworks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtworkList' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [artworks]
      operationId: createArtwork
      summary: Declare an artwork (title, description, content type and length) and get a one-time upload token.
      description: |
        The declaration is validated against the collection rules (allowed type, size within a tier). The artwork
        is created in `submitted`. `uploadToken` is a random 256-bit bearer secret returned exactly once (only its
        SHA-256 is stored); it authorises `PUT /v1/artworks/{id}/content`. No per-artist cap (rule `quantity`).
        `maxEditions` (1-10000) makes it a limited edition; omitted or null is an open edition (ADR-0012).
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateArtworkRequest' }
      responses:
        '201':
          description: Artwork created (`submitted`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateArtworkResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/artworks/{id}:
    parameters:
      - $ref: '#/components/parameters/ArtworkId'
    get:
      tags: [artworks]
      operationId: getArtwork
      summary: Artwork view. Public once `approved`; otherwise visible to the owner (session) or an API key, 404 to anyone else.
      security:
        - {}
        - session: []
        - apiKey: []
      responses:
        '200':
          description: Artwork
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artwork' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [artworks]
      operationId: delistArtwork
      summary: The artist delists an approved artwork (`approved` -> `delisted`). The bytes stay content-addressed but are no longer served.
      security:
        - session: []
      responses:
        '200':
          description: Artwork now `delisted`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artwork' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/artworks/{id}/content:
    parameters:
      - $ref: '#/components/parameters/ArtworkId'
    put:
      tags: [artworks]
      operationId: uploadArtworkContent
      summary: Upload the exact bytes; the review runs once, here.
      description: |
        Requires status `submitted` (409 `conflict` otherwise) and the upload token. 422 `content_mismatch` when
        the length differs from the declaration. The bytes are stored content-addressed (sha256), then reviewed:
        rules on the real bytes (magic bytes, header dimensions, square, size tier) and, if configured, the
        vision model against the Degent design rules. Outcomes: `approved`; `rejected` (200, see
        `review.automated.reasons`); or `reviewing` with `needsHuman: true` when the vision check was skipped
        (unsupported type, oversized image, no vision reviewer) - a skipped check never approves. If the
        reviewer is unavailable: 503 `review_unavailable` and the artwork stays `submitted` for a retry.
      security:
        - uploadToken: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
              maxLength: 4194304
      responses:
        '200':
          description: Artwork after review (`approved`, `rejected` or `reviewing` with `needsHuman`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artwork' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
    get:
      tags: [artworks]
      operationId: getArtworkContent
      summary: The exact bytes of an approved artwork (404 for any other status). Immutable; ETag is the sha256.
      description: |
        Headers: `content-type` (the real image type), `content-length`, `etag: "<sha256>"`,
        `cache-control: public, max-age=31536000, immutable`. `If-None-Match` with the ETag returns 304.
        The mint front end fetches these bytes and PUTs them unchanged to the mint service.
      parameters:
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Image bytes
          headers:
            ETag: { schema: { type: string }, description: '`"<sha256>"`' }
            Cache-Control: { schema: { type: string }, description: 'public, max-age=31536000, immutable' }
          content:
            image/jpeg: { schema: { type: string, contentMediaType: image/jpeg } }
            image/png: { schema: { type: string, contentMediaType: image/png } }
            image/webp: { schema: { type: string, contentMediaType: image/webp } }
            image/gif: { schema: { type: string, contentMediaType: image/gif } }
            image/avif: { schema: { type: string, contentMediaType: image/avif } }
        '304':
          description: Not modified (ETag matched)
        '404': { $ref: '#/components/responses/Error' }
  /v1/artworks/{id}/review:
    parameters:
      - $ref: '#/components/parameters/ArtworkId'
    post:
      tags: [artworks]
      operationId: houseReview
      summary: House reviewer verdict (API key scope `studio:review`). Resolves `needsHuman`; can also take down or reinstate.
      description: |
        Allowed transitions: `reviewing` -> `approved` | `rejected`; `approved` -> `rejected`; `rejected` ->
        `approved`. Anything else is 409 `illegal_transition`. `reasons` are shown to the artist on reject.
        A verdict on an artwork with an open appeal resolves the appeal (`granted` on approve, `denied` on
        reject) with the same reasons.
      security:
        - apiKey: [studio:review]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HouseReviewRequest' }
      responses:
        '200':
          description: Artwork after the verdict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artwork' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/artworks/{id}/feature:
    parameters:
      - $ref: '#/components/parameters/ArtworkId'
    post:
      tags: [artworks]
      operationId: featureArtwork
      summary: Curate the gallery (API key scope `studio:review`) - featured artworks list first. Only `approved` artworks (409 otherwise).
      description: |
        `rank` (optional, 1-1000, lower lists first) orders the front room: the gallery is `featuredRank`
        ascending with unranked artworks last, then featured, then newest. `rank` needs `featured: true`
        (422 otherwise); left out it keeps the current rank, `null` clears it. Unfeaturing clears the rank.
      security:
        - apiKey: [studio:review]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeatureRequest' }
      responses:
        '200':
          description: Artwork with the new `featured` flag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artwork' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/artworks/{id}/editions:
    parameters:
      - $ref: '#/components/parameters/ArtworkId'
    put:
      tags: [artworks]
      operationId: setArtworkEditions
      summary: The artist sets or changes the edition cap (`maxEditions` 1-10000, or null for an open edition).
      description: |
        Owner session only (403 otherwise); not on a `delisted` artwork (409 `conflict`). Before the first mint
        any value is accepted. After it the cap may be raised, opened (null) or lowered, but never below
        `mintedEditions` (409 `conflict` with `details.mintedEditions`). Lowering the cap does not cancel quotes
        the mint already issued: an outstanding quote keeps its reserved edition (ADR-0012).
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditionsRequest' }
      responses:
        '200':
          description: Artwork with the new cap
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artwork' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/artworks/{id}/appeal:
    parameters:
      - $ref: '#/components/parameters/ArtworkId'
    post:
      tags: [appeals]
      operationId: appealArtwork
      summary: 'The artist asks for a human review of a rejection (`rejected` -> `reviewing`, `needsHuman: true`).'
      description: |
        Owner session only (403 otherwise). Only a `rejected` artwork can be appealed (409 `illegal_transition`
        otherwise). One open appeal at a time and at most 3 appeals per artwork (409 `conflict` with
        `details.appeals` / `details.max`). The artwork moves to `reviewing` with `needsHuman: true` and the
        transition is emitted as `degent.artwork.reviewing` with detail `appeal`; the house resolves it with
        `POST /v1/artworks/{id}/review`. The message is shown to the house only, never in events.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppealRequest' }
      responses:
        '201':
          description: Appeal recorded; the artwork is `reviewing`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppealResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/appeals:
    get:
      tags: [appeals]
      operationId: listAppeals
      summary: The house appeal queue (API key scope `studio:review`), oldest first.
      security:
        - apiKey: [studio:review]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AppealStatus' }
          description: Default `open`.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of appeals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppealList' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/internal/artists/{address}/payout:
    get:
      tags: [internal]
      operationId: getArtistPayout
      summary: The artist's proven payout address, for the mint service (API key scope `studio:internal`).
      description: |
        The public profile does not carry the payout address. The mint needs it to quote the artist royalty
        (output [1] of the minter's funding PSBT, ADR-0007), so it reads it here with an internal key.
        `payoutAddress` is null until the artist has proven one with a BIP-322 signature.
      security:
        - apiKey: [studio:internal]
      parameters:
        - name: address
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The artist's payout facts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtistPayout' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/internal/royalties:
    post:
      tags: [internal]
      operationId: recordRoyalty
      summary: The mint service records a royalty payment (API key scope `studio:internal`). Idempotent on `orderId`.
      description: |
        Called after the minter's funding transaction is seen: output [1] of the funding PSBT paid `royaltySats`
        to the artist's payout address (ADR-0007 §5). The same `orderId` posted again with identical facts is
        200 (`created: false`); with different facts it is 409 `conflict`. Unknown `artworkId` is 404.
        `edition` (optional) is the edition number the mint assigned. Each new record counts one minted edition
        of the artwork (`mintedEditions`) and notifies the artist; a replay does neither.
      security:
        - apiKey: [studio:internal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoyaltyRecordRequest' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoyaltyRecordResponse' }
        '200':
          description: Already recorded with the same facts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoyaltyRecordResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

webhooks:
  artistNotification:
    post:
      tags: [artists]
      operationId: artistNotification
      summary: What the studio POSTs to an artist's registered `notify.webhookUrl` (delivered by `@bsh/notify`).
      description: |
        Body: a CloudEvents 1.0 envelope (`source = urn:bsh:degent-studio`, `subject = artworkId`) whose `data` is
        an `ArtistNotification`. `type` is `degent.studio.notify.<recipient>.<kind>` where `<recipient>` is the
        first 32 hex characters of sha256(artist address) (the notifier routes by topic) and `<kind>` is `data.kind`
        with `.` kept (`artwork.approved`, `artwork.rejected`, `artwork.needs_human`, `royalty.recorded`).
        Verify `Bsh-Signature` on the RAW body with the secret returned once by `PUT /v1/artists/me`
        (`verifyWebhookSignature` in `@bsh/notify`; 300 s tolerance) and de-duplicate on `Idempotency-Key`.
        Any 2xx acknowledges; 408/425/429/5xx and timeouts are retried with backoff; redirects are not followed.
        Telegram chats receive `data.message` as plain text.
      parameters:
        - { name: Bsh-Signature, in: header, required: true, schema: { type: string }, description: '`t=<unix seconds>,v1=<hex HMAC-SHA256>`' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string }, description: Stable per (subscription, event). }
        - { name: Bsh-Event-Id, in: header, required: true, schema: { type: string } }
        - { name: Bsh-Event-Type, in: header, required: true, schema: { type: string } }
        - { name: Bsh-Delivery-Attempt, in: header, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema: { $ref: '#/components/schemas/ArtistNotificationEnvelope' }
      responses:
        '200':
          description: Any 2xx acknowledges the delivery.

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Artist session from `POST /v1/auth/verify`: compact JWS, EdDSA/Ed25519 (`@bsh/identity`), `aud` = `degent`,
        scope `artist`, `sub` = the signed-in address. Missing/invalid/expired -> 401 `unauthorized`.
    uploadToken:
      type: http
      scheme: bearer
      description: |
        The `uploadToken` returned once by `POST /v1/artworks`. Missing or malformed -> 401 `unauthorized`; wrong
        token for the artwork -> 403 `forbidden`. Compared in constant time against a stored SHA-256.
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        `@bsh/edge` API key (`bsh_live_...` / `bsh_test_...`; also accepted as `Authorization: Bearer bsh_...`).
        Scopes: `studio:review` (house review, feature), `studio:internal` (royalty records; also reads any
        artwork). 401 `missing_api_key` / `invalid_api_key`, 403 `insufficient_scope`.
  parameters:
    ArtworkId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$', examples: [art_4f1c2a9b0e6d7c8a1b2c3d4e] }
    ArtistAddress:
      name: address
      in: path
      required: true
      schema: { type: string, minLength: 14, maxLength: 90 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
  headers:
    RetryAfter:
      description: Seconds until the rate-limit bucket refills enough for one request.
      schema: { type: integer }
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many mutating requests from this client IP (code `rate_limited`)
      headers:
        retry-after: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Network: { type: string, enum: [mainnet, testnet, signet, regtest] }
    Timestamp: { type: string, format: date-time }
    Hex32: { type: string, pattern: '^[0-9a-f]{64}$' }
    Sats: { type: integer, minimum: 0, description: Integer satoshis }
    ArtworkStatus:
      type: string
      enum: [submitted, reviewing, approved, rejected, delisted]
      description: |
        `submitted` (declared, no bytes yet) -> `reviewing` (bytes received; automated review ran; `needsHuman`
        says whether the house must look) -> `approved` | `rejected`. `approved` -> `delisted` (artist) or
        `rejected` (house); `rejected` -> `approved` (house) or `reviewing` (artist's appeal, `needsHuman: true`).
        `delisted` is terminal.
    DegentRule:
      type: object
      additionalProperties: false
      required: [id, title, text, check]
      properties:
        id: { type: string, enum: [format, square, design, framing, quantity] }
        title: { type: string }
        text: { type: string }
        check: { type: string, enum: [automated, vision, both] }
    TierRule:
      type: object
      additionalProperties: false
      required: [tier, label, minBytes, maxBytes]
      properties:
        tier: { type: string, enum: [standard, large, fullblock] }
        label: { type: string }
        minBytes: { type: integer }
        maxBytes: { type: integer }
    ConfigResponse:
      type: object
      additionalProperties: false
      required: [network, rulesVersion, rules, recommendedContentType, allowedContentTypes, tiers, minDimensionPx, maxDimensionPx,
                 maxUploadBytes, titleMaxChars, descriptionMaxChars, displayNameMaxChars, siwb, session, payoutMessageTemplate,
                 payoutAddressKinds, visionReview]
      properties:
        network: { $ref: '#/components/schemas/Network' }
        rulesVersion: { type: string, examples: ['1.0.0'] }
        rules: { type: array, items: { $ref: '#/components/schemas/DegentRule' } }
        recommendedContentType: { type: string, examples: [image/jpeg] }
        allowedContentTypes: { type: array, items: { type: string } }
        tiers: { type: array, items: { $ref: '#/components/schemas/TierRule' } }
        minDimensionPx: { type: integer }
        maxDimensionPx: { type: integer }
        maxUploadBytes: { type: integer, examples: [4194304] }
        titleMaxChars: { type: integer, examples: [80] }
        descriptionMaxChars: { type: integer, examples: [500] }
        displayNameMaxChars: { type: integer, examples: [40] }
        siwb:
          type: object
          additionalProperties: false
          required: [domain, uri, ttlSeconds]
          properties:
            domain: { type: string, examples: [studio.degent.club] }
            uri: { type: string, examples: ['https://studio.degent.club'] }
            ttlSeconds: { type: integer }
        session:
          type: object
          additionalProperties: false
          required: [ttlSeconds, audience, scopes]
          properties:
            ttlSeconds: { type: integer }
            audience: { type: string, examples: [degent] }
            scopes: { type: array, items: { type: string } }
        payoutMessageTemplate:
          type: string
          description: Text the payout address signs (BIP-322 simple), with `<address>` and `<sessionSub>` substituted.
          examples: ['degent.club payout address <address> for <sessionSub>']
        payoutAddressKinds: { type: array, items: { type: string, enum: [p2wpkh, p2tr] } }
        visionReview: { type: string, enum: [claude, none], description: '`none` means every submission needs a human for the design rules.' }
        maxEditionsLimit: { type: integer, examples: [10000], description: Largest accepted `maxEditions` (ADR-0012). }
        featuredRankMax: { type: integer, examples: [1000], description: Largest accepted `featuredRank`. }
        appealMessageMaxChars: { type: integer, examples: [1000] }
        appealsPerArtwork: { type: integer, examples: [3], description: Appeals allowed per artwork over its lifetime. }
        notifyChannels:
          type: array
          items: { type: string }
          examples: [[webhook, telegram]]
          description: Notification channels this studio delivers (`webhook` always; `telegram` when a bot is configured).
    ChallengeRequest:
      type: object
      additionalProperties: false
      required: [address, network]
      properties:
        address: { type: string, minLength: 14, maxLength: 90 }
        network: { $ref: '#/components/schemas/Network' }
    ChallengeResponse:
      type: object
      additionalProperties: false
      required: [message, nonce, address, network, issuedAt, expiresAt]
      properties:
        message: { type: string, description: The exact SIWB text the wallet must sign. }
        nonce: { type: string, pattern: '^[A-Za-z0-9]{16,64}$' }
        address: { type: string }
        network: { $ref: '#/components/schemas/Network' }
        issuedAt: { $ref: '#/components/schemas/Timestamp' }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
    VerifyRequest:
      type: object
      additionalProperties: false
      required: [message, signature, address]
      properties:
        message: { type: string, maxLength: 4096 }
        signature: { type: string, maxLength: 4096, description: 'base64: BIP-322 simple witness, or a 65-byte legacy signmessage signature.' }
        address: { type: string, minLength: 14, maxLength: 90 }
    SessionResponse:
      type: object
      additionalProperties: false
      required: [token, expiresAt, method, artist]
      properties:
        token: { type: string, description: Bearer session JWT (EdDSA). }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        method: { type: string, enum: [bip322-simple, legacy] }
        artist: { $ref: '#/components/schemas/Artist' }
    ArtworkCounts:
      type: object
      additionalProperties: false
      required: [total, approved]
      properties:
        total: { type: integer, minimum: 0 }
        approved: { type: integer, minimum: 0 }
    Artist:
      type: object
      additionalProperties: false
      required: [address, network, displayName, payoutAddress, payoutVerifiedAt, artworks, joinedAt, updatedAt]
      properties:
        address: { type: string, description: The signed-in address (session `sub`); the artist's identity. }
        network: { $ref: '#/components/schemas/Network' }
        displayName: { type: [string, 'null'], maxLength: 40 }
        payoutAddress: { type: [string, 'null'], description: Segwit or taproot address proven by BIP-322; receives the royalty output. }
        payoutVerifiedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        artworks: { $ref: '#/components/schemas/ArtworkCounts' }
        joinedAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        notify: { $ref: '#/components/schemas/ArtistNotify' }
        notifyWebhookSecret:
          type: string
          pattern: '^whsec_[A-Za-z0-9_-]{43}$'
          description: |
            The webhook signing secret, present ONLY in the `PUT /v1/artists/me` response that generated it (first
            webhook, or `rotateWebhookSecret`). Store it; it is never shown again.
    ArtistNotify:
      type: object
      additionalProperties: false
      required: [webhookUrl, telegramChatId, webhookSecretSet]
      properties:
        webhookUrl: { type: [string, 'null'] }
        telegramChatId: { type: [string, 'null'] }
        webhookSecretSet: { type: boolean, description: Whether a signing secret exists (the value is never returned again). }
    UpdateArtistRequest:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: [string, 'null'], maxLength: 40, description: Null clears it. }
        notify:
          description: Notification targets; null clears both. A field left out is unchanged.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              properties:
                webhookUrl: { type: [string, 'null'], maxLength: 2048, description: 'https URL; null clears it (and deletes the secret).' }
                telegramChatId: { type: [string, 'null'], pattern: '^(-?[0-9]{1,20}|@[A-Za-z][A-Za-z0-9_]{4,31})$', description: Numeric chat id or @channel. }
                rotateWebhookSecret: { type: boolean, description: Generate a new webhook signing secret (returned once). }
        payout:
          type: object
          additionalProperties: false
          required: [address, signature]
          properties:
            address: { type: string, minLength: 14, maxLength: 90 }
            signature: { type: string, maxLength: 4096, description: BIP-322 simple signature (base64) over the payout message. }
    ArtistPayout:
      type: object
      additionalProperties: false
      required: [address, payoutAddress, payoutVerifiedAt]
      properties:
        address: { type: string, description: The artist's signed-in address. }
        payoutAddress: { type: [string, 'null'], description: Segwit (P2WPKH) or taproot (P2TR) address proven by BIP-322. }
        payoutVerifiedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
    PublicArtist:
      type: object
      additionalProperties: false
      required: [address, displayName, artworks, joinedAt]
      properties:
        address: { type: string }
        displayName: { type: [string, 'null'] }
        artworks: { type: integer, minimum: 0, description: Approved artworks. }
        joinedAt: { $ref: '#/components/schemas/Timestamp' }
    ReviewCheck:
      type: object
      additionalProperties: false
      required: [id, passed, detail]
      properties:
        id: { type: string }
        passed: { type: boolean }
        detail: { type: string }
    AutomatedReview:
      type: object
      additionalProperties: false
      required: [approved, needsHuman, reasons, checks, reviewer]
      properties:
        approved: { type: boolean }
        needsHuman: { type: boolean, description: True when a check was skipped; never auto-approved. }
        reasons: { type: array, items: { type: string } }
        checks: { type: array, items: { $ref: '#/components/schemas/ReviewCheck' } }
        reviewer: { type: string, examples: [rules+vision] }
    HouseReview:
      type: object
      additionalProperties: false
      required: [decision, reasons, reviewerId, at]
      properties:
        decision: { type: string, enum: [approve, reject] }
        reasons: { type: array, items: { type: string } }
        reviewerId: { type: string, description: API key id (never the key). }
        at: { $ref: '#/components/schemas/Timestamp' }
    ArtworkReview:
      type: object
      additionalProperties: false
      required: [automated, house, reviewedAt]
      properties:
        automated: { oneOf: [{ $ref: '#/components/schemas/AutomatedReview' }, { type: 'null' }] }
        house: { oneOf: [{ $ref: '#/components/schemas/HouseReview' }, { type: 'null' }] }
        reviewedAt: { $ref: '#/components/schemas/Timestamp' }
    ArtworkEvent:
      type: object
      additionalProperties: false
      required: [status, at]
      properties:
        status: { $ref: '#/components/schemas/ArtworkStatus' }
        at: { $ref: '#/components/schemas/Timestamp' }
        detail: { type: string }
    Artwork:
      type: object
      additionalProperties: false
      required: [id, artist, network, title, description, contentType, contentLength, contentSha256, status, needsHuman, review,
                 featured, featuredAt, contentUrl, timeline, createdAt, updatedAt]
      properties:
        id: { type: string }
        artist: { type: string, description: Artist address. }
        network: { $ref: '#/components/schemas/Network' }
        title: { type: string, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 500 }
        contentType: { type: string }
        contentLength: { type: integer }
        contentSha256: { oneOf: [{ $ref: '#/components/schemas/Hex32' }, { type: 'null' }], description: Null until the bytes are uploaded. }
        status: { $ref: '#/components/schemas/ArtworkStatus' }
        needsHuman: { type: boolean }
        review: { oneOf: [{ $ref: '#/components/schemas/ArtworkReview' }, { type: 'null' }] }
        featured: { type: boolean }
        featuredAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        contentUrl: { type: [string, 'null'], description: '`/v1/artworks/{id}/content` while approved, else null.' }
        timeline: { type: array, items: { $ref: '#/components/schemas/ArtworkEvent' } }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        maxEditions: { type: [integer, 'null'], minimum: 1, maximum: 10000, description: Edition cap; null = open edition (ADR-0012). }
        mintedEditions: { type: integer, minimum: 0, description: Royalty records the mint posted for this artwork. }
        soldOut: { type: boolean, description: '`maxEditions` is set and `mintedEditions` reached it; the mint refuses new orders.' }
        featuredRank: { type: [integer, 'null'], minimum: 1, maximum: 1000, description: House curation order (lower first); null = unranked. }
        appeals:
          type: array
          items: { $ref: '#/components/schemas/Appeal' }
          description: The artist's appeals, oldest first. Only shown to the owner and to API keys.
    CreateArtworkRequest:
      type: object
      additionalProperties: false
      required: [title, contentType, contentLength]
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        contentType: { type: string, maxLength: 100 }
        contentLength: { type: integer, minimum: 1 }
        maxEditions: { type: [integer, 'null'], minimum: 1, maximum: 10000, description: Edition cap; omitted or null = open edition. }
    EditionsRequest:
      type: object
      additionalProperties: false
      required: [maxEditions]
      properties:
        maxEditions: { type: [integer, 'null'], minimum: 1, maximum: 10000, description: Null opens the edition. }
    AppealStatus:
      type: string
      enum: [open, granted, denied]
      description: '`open` until the house rules; `granted` (approved) or `denied` (rejected again).'
    AppealRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 1000, description: Why the artist believes the rules are met. }
    Appeal:
      type: object
      additionalProperties: false
      required: [id, artworkId, artist, message, status, createdAt, resolvedAt, resolution]
      properties:
        id: { type: string, examples: ['art_4f1c2a9b0e6d7c8a1b2c3d4e:appeal:1'] }
        artworkId: { type: string }
        artist: { type: string }
        message: { type: string, maxLength: 1000 }
        status: { $ref: '#/components/schemas/AppealStatus' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        resolvedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        resolution: { oneOf: [{ $ref: '#/components/schemas/HouseReview' }, { type: 'null' }] }
    AppealResponse:
      type: object
      additionalProperties: false
      required: [appeal, artwork]
      properties:
        appeal: { $ref: '#/components/schemas/Appeal' }
        artwork: { $ref: '#/components/schemas/Artwork' }
    AppealList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Appeal' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    CreateArtworkResponse:
      type: object
      additionalProperties: false
      required: [artwork, uploadToken]
      properties:
        artwork: { $ref: '#/components/schemas/Artwork' }
        uploadToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: 256-bit base64url bearer secret, returned once.
    ArtworkList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Artwork' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    HouseReviewRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        reasons: { type: array, maxItems: 10, items: { type: string, maxLength: 200 } }
    FeatureRequest:
      type: object
      additionalProperties: false
      required: [featured]
      properties:
        featured: { type: boolean }
        rank: { type: [integer, 'null'], minimum: 1, maximum: 1000, description: '`featuredRank` (lower first); needs `featured: true`; null clears it.' }
    RoyaltyRecordRequest:
      type: object
      additionalProperties: false
      required: [orderId, artworkId, royaltySats, fundingTxid, vout, at]
      properties:
        orderId: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$', description: The mint order id (idempotency key). }
        artworkId: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        minterAddress: { type: [string, 'null'], maxLength: 90 }
        royaltySats: { $ref: '#/components/schemas/Sats' }
        fundingTxid: { $ref: '#/components/schemas/Hex32' }
        vout: { type: integer, minimum: 0, description: Output index of the royalty in the funding tx (1 per ADR-0007). }
        at: { $ref: '#/components/schemas/Timestamp' }
        edition: { type: integer, minimum: 1, description: The edition number the mint assigned (ADR-0012). }
    RoyaltyRecord:
      type: object
      additionalProperties: false
      required: [orderId, artworkId, artist, minterAddress, royaltySats, fundingTxid, vout, at, recordedAt]
      properties:
        orderId: { type: string }
        artworkId: { type: string }
        artist: { type: string }
        minterAddress: { type: [string, 'null'] }
        royaltySats: { $ref: '#/components/schemas/Sats' }
        fundingTxid: { $ref: '#/components/schemas/Hex32' }
        vout: { type: integer, minimum: 0 }
        at: { $ref: '#/components/schemas/Timestamp' }
        recordedAt: { $ref: '#/components/schemas/Timestamp' }
        edition: { type: integer, minimum: 1 }
    RoyaltyRecordResponse:
      type: object
      additionalProperties: false
      required: [record, created]
      properties:
        record: { $ref: '#/components/schemas/RoyaltyRecord' }
        created: { type: boolean }
    RoyaltiesResponse:
      type: object
      additionalProperties: false
      required: [items, totals, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RoyaltyRecord' } }
        totals:
          type: object
          additionalProperties: false
          required: [records, royaltySats]
          properties:
            records: { type: integer, minimum: 0 }
            royaltySats: { $ref: '#/components/schemas/Sats' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, network, version, time, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        network: { $ref: '#/components/schemas/Network' }
        version: { type: string }
        time: { $ref: '#/components/schemas/Timestamp' }
        checks:
          type: object
          additionalProperties:
            type: object
            required: [ok]
            properties:
              ok: { type: boolean }
              detail: { type: string }
    ArtistNotification:
      type: object
      additionalProperties: false
      required: [kind, artist, artworkId, title, message, at]
      properties:
        kind: { type: string, enum: [artwork.approved, artwork.rejected, artwork.needs_human, royalty.recorded] }
        artist: { type: string, description: The artist's address. }
        artworkId: { type: string }
        title: { type: string }
        message: { type: string, description: 'Human text, e.g. "Your Degent ''Gentleman No. 1'' was minted, edition #3, 12345 sats paid in <txid>:1".' }
        at: { $ref: '#/components/schemas/Timestamp' }
        reasons: { type: array, items: { type: string }, description: '`artwork.rejected`: the reasons.' }
        orderId: { type: string, description: '`royalty.recorded`: the mint order.' }
        edition: { type: integer, minimum: 1 }
        royaltySats: { $ref: '#/components/schemas/Sats' }
        fundingTxid: { $ref: '#/components/schemas/Hex32' }
