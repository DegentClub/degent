version: '3.8'

services:
  degent-x-bot:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: always
    volumes:
      - ./brain:/app/brain

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dgentx
      POSTGRES_USER: dgentx
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dgentx}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
