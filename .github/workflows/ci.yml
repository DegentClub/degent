# CI for DegentClub/degent. The platform and the catalog tool come from the deps/scribbit submodule
# (pinned commit), so the checkout is recursive; `pnpm test` also runs the platform's tests at that pin.
# Structure gates (manifests, boundaries, catalog, CODEOWNERS) always run on the whole repo: they are
# cheap and a change anywhere can break them. Typecheck/test run on affected packages only for PRs
# (changed packages + their dependents, via pnpm's "...[origin/main]" filter) and on everything on main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so "...[origin/main]" can diff against the base
          submodules: recursive # deps/scribbit: the platform + catalog tool at the pinned commit

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0; pnpm version comes from package.json "packageManager"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate component manifests
        run: pnpm validate

      - name: Enforce import boundaries
        run: pnpm lint:boundaries

      - name: Catalog is up to date
        run: pnpm catalog --check

      - name: CODEOWNERS is up to date
        run: pnpm --filter @bsh/catalog-tool run codeowners --check --org DegentClub

      - name: Open-source readiness (licence, community files, security workflows, package READMEs)
        # `readiness` ships with the catalog tool in DegentClub/scribbit. Until deps/scribbit is bumped to a commit
        # that has it, this step warns instead of failing; after the bump it is a hard gate.
        run: |
          if grep -q '"readiness"' deps/scribbit/tools/catalog/package.json; then
            pnpm --filter @bsh/catalog-tool run readiness
          else
            echo "::warning::deps/scribbit predates the catalog tool's readiness command; bump the pin to enable this gate"
          fi

      - name: No breaking OpenAPI changes (oasdiff)
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          status=0
          for f in $(git diff --name-only --diff-filter=M "$base"...HEAD -- 'contracts/openapi/*.yaml' 'contracts/openapi/*.yml' 'contracts/openapi/*.json'); do
            mkdir -p /tmp/base/$(dirname "$f")
            git show "$base:$f" > "/tmp/base/$f"
            echo "::group::oasdiff $f"
            docker run --rm -v /tmp/base:/base -v "$PWD":/head tufin/oasdiff breaking "/base/$f" "/head/$f" --fail-on ERR || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Typecheck (affected)
        if: github.event_name == 'pull_request'
        run: pnpm --filter "...[origin/${{ github.base_ref }}]" run --if-present typecheck

      - name: Test (affected)
        if: github.event_name == 'pull_request'
        run: pnpm --filter "...[origin/${{ github.base_ref }}]" run --if-present test

      - name: Typecheck (all)
        if: github.event_name != 'pull_request'
        run: pnpm typecheck

      - name: Test (all)
        if: github.event_name != 'pull_request'
        run: pnpm test

      - name: Build web app
        run: pnpm --filter @bsh/degent-web build
