name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Server boots with buys paused
        run: |
          BUYS_ENABLED=false DB_PATH=/tmp/ci-market.db PORT=3789 node src/index.js &
          PID=$!
          sleep 3
          curl -sf http://127.0.0.1:3789/api/health | grep -q '"buysEnabled":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3789/api/buy/prepare)" = "503"
          kill $PID
